# Dispatcharr - Live TV Proxy and DVR Processor for Jellyfin/Plex/Emby
#
# Purpose:
#   Processes live TV streams through Radarr/Sonarr for commercials removal
#   Provides DVR-like functionality with automatic quality upgrades
#
# Key Features:
#   - Live TV stream proxying with on-the-fly processing
#   - Commercial detection and removal (Comskip integration)
#   - Automatic quality upgrade when better version available
#   - Hardware-accelerated transcoding (VA-API)
#   - EPG (Electronic Program Guide) management
#   - Recording scheduling and conflict resolution
#   - Post-processing integration with Radarr/Sonarr
#
# Workflow:
#   Live TV → Dispatcharr → Transcode/Remove commercials → Send to Radarr/Sonarr → Library
#
# Access:
#   URL: https://dispatcharr.deercrest.info
#   Middleware: chain-authelia (protected - admin only)
#

########################### NETWORKS
networks:

  dispatcharr:
    name: dispatcharr
    driver: bridge
  
  iot_macvlan:
    external: true

services:
  dispatcharr:
    hostname: "dispatcharr"
    image: ghcr.io/dispatcharr/dispatcharr:0.30.0
    container_name: dispatcharr
    restart: unless-stopped
    networks:
      iot_macvlan:
        ipv4_address: 172.16.1.75
      t3_proxy:
      dispatcharr:
    ports:
      # HOST PORT 9192, CONTAINER PORT 9191 -- do not "tidy" this back to 9191:9191.
      #
      # pulse-agent (the Pulse monitoring agent, a bare-metal systemd service on this LXC --
      # NOT a compose stack) binds 127.0.0.1:9191 for its health/metrics endpoint. Publishing
      # dispatcharr on 9191 therefore fails at container start with:
      #   failed to bind host port 0.0.0.0:9191/tcp: address already in use
      # The container sat in `created` state, never started, from 2026-06-30 to 2026-08-11
      # because of this. See NETWORK.md -> "Host-level services on LXC 100".
      #
      # NOTE: this publish is largely vestigial. dispatcharr is on iot_macvlan with its own LAN
      # IP (172.16.1.75), and that is the real endpoint -- dispatcharr advertises
      # BaseURL http://172.16.1.75:9191/hdhr itself. The published port answers on 127.0.0.1
      # from inside the LXC but FAILS from other hosts, because dispatcharr's default route goes
      # out the macvlan interface and replies via the docker-proxy path are asymmetric.
      #
      # Point Jellyfin at http://172.16.1.75:9191 (verified from inside the jellyfin container),
      # NOT at this port and NOT at dispatcharr.deercrest.info (that route has chain-authelia).
      # Kept only because removing a published port is a separate change; it is harmless on 9192.
      - 9192:9191
    volumes:
      - /mnt/fast/appdata/media/dispatcharr/data:/data:rw  # Application config, recordings queue, and processing state
    environment:
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      # Process Priority Configuration (Optional)
      # Lower values = higher priority. Range: -20 (highest) to 19 (lowest)
      # Negative values require cap_add: SYS_NICE (uncomment below)
      #- UWSGI_NICE_LEVEL=-5   # uWSGI/FFmpeg/Streaming (default: 0, recommended: -5 for high priority)
      #- CELERY_NICE_LEVEL=5   # Celery/EPG/Background tasks (default: 5, low priority)
    cap_add:
     - SYS_NICE
    group_add:
      - "44"   # video group for AMD GPU access
      - "110"  # render group for AMD Radeon 890M GPU access (must match LXC idmap passthrough)
    devices:
      - /dev/dri:/dev/dri  # For Intel/AMD GPU acceleration (VA-API)
    # Uncomment the following lines for NVIDIA GPU support
    # NVidia GPU support (requires NVIDIA Container Toolkit)
    #deploy:
    #  resources:
    #      reservations:
    #          devices:
    #              - driver: nvidia
    #                count: all
    #                capabilities: [gpu]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dispatcharr.entrypoints=web,websecure
      - traefik.http.routers.dispatcharr.rule=Host(`dispatcharr.deercrest.info`)
      - traefik.http.routers.dispatcharr.middlewares=chain-authelia@file
      - traefik.http.routers.dispatcharr.tls=true
      - traefik.http.routers.dispatcharr.tls.certresolver=dns-cloudflare
      - traefik.http.routers.dispatcharr.priority=99
      - traefik.http.routers.dispatcharr.service=dispatcharr-svc
      - traefik.http.services.dispatcharr-svc.loadbalancer.server.port=9191

      # --- tv.deercrest.info : Xtream Codes endpoint for off-LAN TV clients ---
      #
      # The Samsung Tizen TV at Fosse Road is not on Tailscale, so it needs a public
      # endpoint. It CANNOT use dispatcharr.deercrest.info -- that router carries
      # chain-authelia, and an IPTV player has no browser to complete an auth flow.
      #
      # This router therefore has NO authelia. Authentication is the XC credential
      # (user `fosse-tv` + custom_properties.xc_password, a dispatcharr STREAMER-level
      # account capped at stream_limit=1). Two things keep that acceptable:
      #
      #   1. The rule allow-lists ONLY the XC paths below. Anything else on this host
      #      matches no router and Traefik returns 404 -- default-deny. In particular
      #      /output/m3u, /output/epg and /hdhr are NOT reachable here; those carry no
      #      auth of their own and are additionally pinned to private ranges via
      #      dispatcharr's own network_access.M3U_EPG ACL.
      #   2. /api/ is deliberately narrowed to /api/channels/logos/ -- channel icons are
      #      unauthenticated PNGs and the TV needs them. The rest of /api/ (the admin
      #      surface) 401s anyway, but it is not exposed here regardless.
      #
      # XC puts username+password in the query string / URL path, so they WILL appear in
      # Traefik access logs, and there is no lockout on failed XC auth -- hence the rate
      # limit below. Rotate the xc_password if those logs are ever shared.
      #
      # DNS: this record MUST be grey-cloud (DNS-only), which makes it the ONE exception
      # in this estate -- dispatcharr.deercrest.info and jellyfin.deercrest.info are both
      # orange-clouded (they resolve to 172.67.x / 104.21.x). It cannot be proxied because
      # Cloudflare's proxy breaks long-lived MPEG-TS (100s timeout) and serving video
      # through the free tier is against their ToS.
      #
      # TRADE-OFF, accept before deploying: grey-cloud publishes the home origin IP in
      # public DNS, losing the origin-hiding the other records get. If that is not
      # acceptable, the alternative is the Tailscale subnet-router option (a travel
      # router at Fosse Road), which exposes nothing at all.
      #
      # (dns-cloudflare on the cert resolver is DNS-01 for issuance only -- unaffected
      # by the record being grey-clouded.)
      - traefik.http.routers.dispatcharr-tv.entrypoints=websecure
      - traefik.http.routers.dispatcharr-tv.rule=Host(`tv.deercrest.info`) && (PathPrefix(`/player_api.php`) || PathPrefix(`/panel_api.php`) || PathPrefix(`/get.php`) || PathPrefix(`/xmltv.php`) || PathPrefix(`/live/`) || PathPrefix(`/timeshift/`) || PathPrefix(`/streaming/`) || PathPrefix(`/api/channels/logos/`))
      - traefik.http.routers.dispatcharr-tv.tls=true
      - traefik.http.routers.dispatcharr-tv.tls.certresolver=dns-cloudflare
      - traefik.http.routers.dispatcharr-tv.priority=100
      - traefik.http.routers.dispatcharr-tv.middlewares=dispatcharr-tv-ratelimit
      - traefik.http.routers.dispatcharr-tv.service=dispatcharr-svc
      # Streaming is one long-lived request, so a low average is fine; the burst covers
      # a client fetching categories + logos on startup.
      - traefik.http.middlewares.dispatcharr-tv-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.dispatcharr-tv-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.dispatcharr-tv-ratelimit.ratelimit.period=1m



