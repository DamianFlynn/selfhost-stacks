# Social Stack - Rybbit
# Web analytics. Rybbit is classified DORMANT (2026-09-25) and does not start
# without `--profile dormant`; see .planning/plans/service-classification.plan.md
#
# Postiz was REMOVED from this stack on 2026-09-25. It was declared in BOTH
# stacks/selfhosted/postiz/ and here, with the same three container names, so only
# one could ever run. postiz/ is the survivor and is itself dormant.

name: social

########################### NETWORKS
networks:
  t3_proxy:
    external: true
  social:
    driver: bridge

########################### VOLUMES
volumes:
  # Rybbit
  rybbit_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/fast/appdata/social/rybbit/data
  rybbit_postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/fast/appdata/social/rybbit/postgres

########################### SERVICES
include:
  - rybbit.yaml
