; neocortex CouchDB settings for Obsidian Self-hosted LiveSync
;
; Bind-mounted READ-ONLY from the repo checkout (compose.yaml) into /opt/couchdb/etc/local.d/;
; `git pull` + a container restart is the only way it changes.
; This repository is PUBLIC: no credentials, no [admins], no [chttpd_auth] secret, no uuid here.
; Those are written at runtime into docker.ini / zz-runtime.ini on the dataset (README).
;
; Values follow the LiveSync provisioning tool (utils/couchdb/provision.ts, pinned in README) and
; its docs/setup_own_server.md. The provisioning run sets the same keys over the REST API; having
; them here means a fresh container comes up correct before that run, and after a restore.

[couchdb]
single_node = true

[cluster]
; One node: without this CouchDB keeps its default n=3 and refuses to create the system databases
; ("Request to create N=3 DB but only 1 node(s)", seen on first deploy 2026-09-17).
n = 1
q = 2
; 50 MB. LiveSync chunks notes and attachments well below this.
max_document_size = 50000000

[chttpd]
bind_address = 0.0.0.0
port = 5984
require_valid_user = true
enable_cors = true
; 4 GiB, per LiveSync. Cloudflare's proxy caps a request at 100 MB on the free plan (README).
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
methods = GET,PUT,POST,HEAD,DELETE
headers = accept,authorization,content-type,origin,referer
max_age = 3600
