# SABnzbd - Usenet Binary Newsreader and Downloader
#
# Purpose:
#   Downloads NZB files from Usenet newsgroups
#   Primary download client for Usenet-based media acquisition
#
# Key Features:
#   - Automated NZB processing and extraction
#   - Multi-server Usenet support (primary + backup)
#   - Automatic PAR2 repair and verification
#   - Password archive handling
#   - Category-based processing and scripts
#   - Download scheduling (off-peak hours)
#   - RSS feed monitoring
#   - API for integration with Radarr/Sonarr
#
# Workflow:
#   Radarr/Sonarr → Sends NZB to SABnzbd → Downloads → Unpacks/Repairs → Moves to category folder
#
# Access:
#   URL: https://sabnzbd.deercrest.info
#   Middleware: chain-authelia (protected - admin access)
#   Bypass URL: Header-based bypass for mobile apps (LunaSea)
#
services:
  # SABnzbd - Binary newsgrabber (NZB downloader)
  # Disable SABNnzbd's built-in HTTPS support for traefik proxy to work
  # Needs trailing / if using PathPrefix
  sabnzbd:
    hostname: "sabnzbd"
    container_name: sabnzbd
    image: ghcr.io/linuxserver/sabnzbd:5.1.3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # profiles: ["apps", "downloads", "all"]
    networks:
      - t3_proxy
    ports:
      - "8084:8080"
    volumes:
      - /mnt/fast/appdata/arrs/sabnzbd/config:/config:rw  # Application config, queue, and history database
      # Init scripts. NOTE (2026-07-31): arr-scripts/scripts_init.bash is a VENDORED copy of
      # RandomNinjaAtk/arr-scripts sabnzbd/setup.bash v3.2, with the blocks that download and
      # overwrite /config/scripts/{video,audio,audiobook}.bash removed. It no longer does
      # `curl <upstream> | bash` on every container start.
      #
      # Why: SABnzbd 5.0 runs post-processing scripts for FAILED jobs too (empty_postproc was
      # removed upstream), and arr-scripts has no job-status check. Those three scripts now carry
      # a local SAB_PP_STATUS guard, and are only durable because setup no longer re-downloads
      # them. Restoring the stock setup.bash silently reverts the guard and lets failed
      # downloads be post-processed into the library.
      #
      # The scripts live in /config/scripts (persistent) -- see each file's header for provenance.
      - /mnt/fast/appdata/arrs/sabnzbd/arr-scripts:/custom-cont-init.d  # Post-processing scripts (vendored, see above)
      # beets config. NOTE (2026-08-18, amended 2026-09-13): sabnzbd/beets-config.yaml is
      # VENDORED in this repo (plan 01-07, SAFE-01 / D-28). It USED to be the config that
      # audio.bash handed to beets on every single music download. It no longer is —
      # plan 04-10 (TAGR-04 / D-10) stripped that one invocation, so nothing reads this
      # config at runtime any more. It is kept, mounted and now CORRECT as a DEFUSED
      # GUARD (D-11); see its own header for why a config nothing reads is worth keeping,
      # and the audio.bash NOTE below for the strip itself.
      #
      # Why the three auto keys in it are deliberately `no`: scrub.auto, lastgenre.auto
      # and embedart.auto ALL DEFAULT TO YES in beets 2.13.1 — verified by running
      # `beet config -d` against a config that names each plugin, not assumed from docs.
      # scrub strips every existing tag on import, lastgenre overwrites genre from
      # Last.fm, and embedart rewrites the audio file to embed artwork. All three fire
      # automatically. There is no `beet undo`; the only reversal is a ZFS rollback.
      # The keys are present even for plugins not in the `plugins:` line, because an
      # absent key is not "off" — it is "on the moment someone adds the plugin".
      #
      # What breaks if you revert this: the container goes back to a beets config that
      # nothing tracks, and the upstream arr-scripts setup.bash re-downloads
      # beets-config.yaml from GitHub (see the NOTE above — that is exactly the class of
      # silent revert the scripts_init.bash vendoring exists to stop). The replacement
      # config carries upstream's defaults, so the next music download scrubs its own
      # tags, overwrites its genres and rewrites its files, against a 34 GB library and
      # a 97 GB backlog with no undo.
      #
      # How much the bind mount actually protects — measured 2026-08-18 in a throwaway
      # container, NOT assumed, because at `:rw` the honest answer was "partly":
      #   `mv tmp dest`  -> BLOCKED, "Resource busy" (EBUSY). This is the pattern
      #                     scripts_init.bash itself uses for sma.ini, i.e. the real
      #                     upstream overwrite path, so the mount does stop it.
      #   `> dest`       -> SUCCEEDED at `:rw`, and the write reached the host file.
      # THAT SECOND HOLE IS CLOSED as of 2026-09-13 (plan 04-10, D-09): the mount below is
      # now `:ro`, which refuses in-place truncation as well as the rename. Both writes
      # from INSIDE the container are now blocked. It is still not tamper-proof — it does
      # nothing about an edit made on the HOST, and that is what the other half of the
      # pair is for: the repo copy makes any divergence detectable.
      #
      # A CLAIM THAT USED TO SIT HERE IS WITHDRAWN (plan 04-10, research finding F6). It
      # named an earlier plan as having already folded that repo-vs-host comparison into
      # scripts/quick-health-check.sh. No such comparison was ever built. It is paraphrased
      # rather than quoted so a mechanical grep for it over this repo keeps returning zero.
      # The comparison DOES exist now: the block headed "Vendored-file drift (D-13)" in
      # scripts/quick-health-check.sh hashes all three vendored files repo-against-host.
      # Cited by that heading and never by line number — a stale pointer is exactly how the
      # withdrawn claim survived this long. Plan 04-10 builds it as a CANDIDATE (it runs
      # only under VENDORED_DRIFT_CANDIDATE=1, so the routine check is unchanged) and plan
      # 04-11 promotes it into the routine path in the same wave that turns it green.
      #
      # The repo copy is for review and history; THIS appdata path is authoritative at
      # runtime. Same hybrid shape as arrs/beets/config.yaml, the surviving tagger's own
      # vendored config. The file's `plugins:` line was knowingly broken and deliberately
      # left so by plan 01-07; plan 04-10 FIXED it to `embedart musicbrainz` (TAGR-05),
      # after plan 04-09 had measured the broken one returning zero MusicBrainz candidates.
      - /mnt/fast/appdata/arrs/sabnzbd/config/scripts/beets-config.yaml:/config/scripts/beets-config.yaml:ro  # Vendored beets config (see above)
      # Post-processing hook. NOTE (2026-09-13): sabnzbd/audio.bash is VENDORED in this
      # repo (plan 04-10, TAGR-04 / D-08). SABnzbd invokes it by name — sabnzbd.ini
      # carries `[[music]] script = audio.bash` — so it runs on EVERY music job, including
      # failed ones (see the arr-scripts NOTE above for the SAB_PP_STATUS guard that
      # handles that). Provenance: RandomNinjaAtk/arr-scripts sabnzbd/audio.bash,
      # scriptVersion 1.9, as it stood on the host at sha256 fdcddca234b2… (339 lines).
      # It was committed BYTE-IDENTICAL first and stripped in a separate commit, so the
      # diff a reviewer reads is exactly one line. DELIBERATELY NO PROVENANCE HEADER INSIDE
      # audio.bash ITSELF: byte-identity against the live copy is the thing being asserted,
      # and a header would break it — which is why this provenance lives here instead.
      #
      # What was removed (D-10), and what was NOT: one line, the
      # `beet -c … -l … -d "$1" import -q "$1"` invocation. Everything else stays and is
      # REPORTED rather than removed, because Phase 8 (INGS-01) owns this hook's shape:
      # clean() still deletes non-audio files, flattens subdirectories and deletes MP3s
      # when FLACs are present; verify() still `rm -rf`s the folder on a flac -t failure;
      # detectsinglefilealbums() still fails oversized files; the beets() body still logs
      # "Matching N tracks with Beets" and then "ERROR: Unable to match…" (both are
      # EXPECTED after the strip, pre-declared in the D-12 evidence so nobody reads them as
      # beets having run) and still removes library.blb behind an existence guard; and the
      #
      # ⚠️  AND THAT beets() BRANCH DOES NOT ONLY LOG — IT CONTAINS AN `rm -rf`. Added
      # 2026-09-14 (code review WR-11), because this inventory is the document a future
      # reader will trust to reconstruct the post-strip behaviour, and enumerating two log
      # lines and a library.blb unlink while omitting the `rm -rf` three lines below them in
      # the same `else` reads as "the branch only logs". BOTH LOG LINES ARE NOW
      # UNCONDITIONAL: the strip removed the only writer that could make an audio file newer
      # than the /config/scripts/beets-match sentinel, so the SUCCESS branch at
      # audio.bash:286 is STRUCTURALLY UNREACHABLE and the `else` at :287 is taken on every
      # music job (measured — plan 04-15's window 2 recorded matching_delta=3 error_delta=3
      # over three real jobs: three error lines, zero success lines). That `else` runs
      # `rm -rf "$1"/*` at :290, gated SOLELY by `requireBeetsMatch` in the container's
      # /config/extended.conf — a file this repo does NOT vendor and must not (it carries
      # five *ArrApiKey fields and THIS REPOSITORY IS PUBLIC). conversion() has the identical
      # shape (WR-01): every ConversionFormat outside {FLAC, OPUS} reaches a second
      # `rm -rf "$1"/*` at :237. Neither value is versioned anywhere; both are ASSERTED on
      # every run by the "extended.conf destructive switches" block in
      # scripts/quick-health-check.sh, which is the only thing standing between a one-character
      # edit of that host file and the deletion of every completed music download.
      #
      # chmod at the end still fails EPERM on tank, which is the baseline Exit(1) every
      # music job has recorded since at least 2026-08-01, not a regression. r128gain is the
      # only other tag writer and it is off (ReplaygainTagging="false"), so after the strip
      # no tag-writing step is active at all.
      #
      # What breaks if you revert this: restoring the stock upstream setup.bash re-downloads
      # audio.bash from GitHub, which silently restores the beets invocation AND drops the
      # SAB_PP_STATUS guard — the same class of silent revert the scripts_init.bash
      # vendoring above exists to stop. The next music download would then be tagged by an
      # unreviewed beets config against a 34 GB library with no undo.
      #
      # How much this mount protects: `:ro` blocks BOTH the rename-based overwrite (EBUSY,
      # the path upstream actually uses) and in-place truncation from inside the container.
      # It does NOT protect against a host-side edit; the "Vendored-file drift (D-13)" block
      # in scripts/quick-health-check.sh is what detects that.
      - /mnt/fast/appdata/arrs/sabnzbd/config/scripts/audio.bash:/config/scripts/audio.bash:ro  # Vendored post-processing hook (see above)
      - /mnt/tank/downloads:/downloads:rw  # Download output directory (incomplete and complete)
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      UMASK_SET: 002
      DOCKER_MODS: ghcr.io/themepark-dev/theme.park:sabnzbd
      TP_THEME: organizr
    labels:
      - traefik.enable=true

      - traefik.http.routers.sabnzbd-rtr.entrypoints=web,websecure
      - traefik.http.routers.sabnzbd-rtr.rule=Host(`sabnzbd.deercrest.info`)
      - traefik.http.routers.sabnzbd-rtr.middlewares=chain-authelia@file
      - traefik.http.routers.sabnzbd-rtr.tls=true
      - traefik.http.routers.sabnzbd-rtr.tls.certresolver=dns-cloudflare
      - traefik.http.routers.sabnzbd-rtr.service=sabnzbd-svc

      - traefik.http.routers.sabnzbd-bypass.entrypoints=websecure
      # - traefik.http.routers.sabnzbd-rtr-bypass.rule=Host(`sabnzbd.deercrest.info`) && Query(`apikey`, `${SABNZBD_API_KEY}`)
      - traefik.http.routers.sabnzbd-bypass.rule=Host(`sabnzbd.deercrest.info`) && Header(`auth-bypass-key`, `${SABNZBD_AUTH_BYPASS_KEY}`) # Bypass Auth for mobile apps
      - traefik.http.routers.sabnzbd-bypass.middlewares=chain-no-auth@file
      - traefik.http.routers.sabnzbd-bypass.tls=true
      - traefik.http.routers.sabnzbd-bypass.tls.certresolver=dns-cloudflare
      - traefik.http.routers.sabnzbd-bypass.priority=100
      - traefik.http.routers.sabnzbd-bypass.service=sabnzbd-svc

      - traefik.http.services.sabnzbd-svc.loadbalancer.server.port=8080


  #SABnzbd Exporter - SABnzbd metrics for Prometheus
  sabnzbd-exporter:
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: sabnzbd-exporter
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # profiles: ["all", "media", "arrs"]
    networks:
      - t3_proxy
    ports:
      - "9713:9713"
    env_file:
      - .env
    environment:
      PORT: 9713
      URL: "http://sabnzbd:8080"
      APIKEY: ${SABNZBD_API_KEY}
      ENABLE_ADDITIONAL_METRICS: TRUE
    command: ["sabnzbd"]


