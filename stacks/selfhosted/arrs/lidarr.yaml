# Lidarr - Music Collection Manager and Downloader
#
# Purpose:
#   Automatically searches, downloads, and organizes music albums and artists
#   Monitors for new releases and integrates with MusicBrainz
#
# Key Features:
#   - Automated music album search via torrent/Usenet
#   - Artist and album monitoring
#   - Quality profiles (Lossless FLAC, 320kbps MP3)
#   - Metadata tagging (ID3, MusicBrainz)
#   - Automatic file organization and renaming
#   - Missing album search
#   - Import existing library with matching
#
# Workflow:
#   Add artist → Monitor releases → Search via Prowlarr → Download → Import to the staging root
#
#   Library scope (2026-08-18, plan 01-06 / WRIT-03):
#     Lidarr is the GRABBER only. It no longer tags, renames or writes anything into
#     /mnt/tank/media/Music. Its root folder is the staging directory on the downloads dataset;
#     its view of the media library is read-only. Replacing it as the grabber is LIDR-01, an
#     explicitly v2 concern — this freeze removes the harm without touching the acquisition role.
#
# Access:
#   URL: https://lidarr.deercrest.info
#   Middleware: chain-authelia (protected - admin access)
#   Bypass URL: Header-based bypass for mobile apps (Helmarr/LunaSea)
#
services:
  # Lidarr - Music management
  # Set url_base in radarr settings if using PathPrefix
  lidarr:
    hostname: "lidarr"
    container_name: lidarr
    image: ghcr.io/linuxserver/lidarr:3.1.0.4875-ls21
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # profiles: ["media", "arrs", "all"]
    networks:
      - t3_proxy
    ports:
      - "8686:8686"
    volumes:
      - /etc/localtime:/etc/localtime:ro  # System timezone
      - /mnt/fast/appdata/arrs/lidarr/config:/config:rw  # Application config and database
      - /mnt/tank/downloads:/downloads:rw  # Download client output directory (also carries the import staging root)
      # NOTE (2026-08-18, plan 01-06 / WRIT-03, D-25): this mount was READ-WRITE and it was the
      # last tagger-class writer on the music library. Lidarr's root folder pointed straight at
      # /media/Music with track renaming on, so it was actively renaming files inside the shared
      # library tree — the fifth writer the project roadmap never counted.
      #
      # What changed: the root folder now resolves to /downloads/lidarr-import (D-23) — outside
      # the library, on the downloads dataset where staging belongs, and absorbable into Phase 5's
      # _inbox structure later. Track renaming is off and every metadata consumer is off (D-24).
      #
      # Why the mount stays broad rather than being narrowed to a subtree: D-25 keeps library
      # visibility on purpose, for existing-library matching and duplicate awareness. Read-only
      # removes the harm without removing the awareness. Narrowing it to Music would cost Lidarr
      # its cross-library duplicate view for no additional safety once it is :ro.
      #
      # Why :ro is load-bearing and not belt-and-braces: deleting the old root folder did NOT
      # detach the 22 existing artists from the library. Lidarr stores an absolute path per
      # artist, so all 22 still read /media/Music/<Artist>. The root-folder change governs where
      # NEW artists land; this :ro suffix is the only thing that actually stops writes to the
      # existing tree.
      #
      # What breaks if someone reverts this: Lidarr regains write access to /mnt/tank/media/Music
      # for 22 artists it already tracks, and the music library silently gains a second writer.
      - /mnt/tank/media:/media:ro  # Read-only library visibility for existing-library matching and duplicate awareness (D-25) — see above
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK_SET: 002
      DOCKER_MODS: ghcr.io/themepark-dev/theme.park:lidarr
      TP_THEME: organizr
    labels:
      - traefik.enable=true

      - traefik.http.routers.lidarr-rtr.entrypoints=web,websecure
      - traefik.http.routers.lidarr-rtr.rule=Host(`lidarr.deercrest.info`)
      - traefik.http.routers.lidarr-rtr.middlewares=chain-authelia@file
      - traefik.http.routers.lidarr-rtr.tls=true
      - traefik.http.routers.lidarr-rtr.tls.certresolver=dns-cloudflare
      - traefik.http.routers.lidarr-rtr.service=lidarr-svc

      - traefik.http.routers.lidarr-bypass.entrypoints=websecure
      # - traefik.http.routers.sabnzbd-rtr-bypass.rule=Host(`sabnzbd.deercrest.info`) && Query(`apikey`, `${RADARR_API_KEY}`)
      - traefik.http.routers.lidarr-bypass.rule=Host(`lidarr.deercrest.info`) && Header(`auth-bypass-key`, `${LIDARR_AUTH_BYPASS_KEY}`) # Bypass Auth for mobile apps
      - traefik.http.routers.lidarr-bypass.middlewares=chain-no-auth@file
      - traefik.http.routers.lidarr-bypass.tls=true
      - traefik.http.routers.lidarr-bypass.tls.certresolver=dns-cloudflare
      - traefik.http.routers.lidarr-bypass.priority=100
      - traefik.http.routers.lidarr-bypass.service=lidarr-svc

      - traefik.http.services.lidarr-svc.loadbalancer.server.port=8686

  # Radarr Exporter - Radarr metrics for Prometheus
  lidarr-exporter:
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: lidarr-exporter
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # profiles: ["all", "media", "arrs"]
    networks:
      - t3_proxy
    ports:
      - "9709:9709"
    env_file:
      - .env
    environment:
      PORT: 9709
      URL: "http://lidarr:8686"
      APIKEY: ${LIDARR_API_KEY}
      ENABLE_ADDITIONAL_METRICS: TRUE
    command: ["lidarr"]

