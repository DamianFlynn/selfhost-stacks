# Beets Configuration for Soulbeet
# Custom configuration for music library management

directory: /music
library: /data/beets_library.db

# Import settings
import:
  move: yes          # Move files (not copy) to library
  write: yes         # Write tags to files
  log: /data/beets_import.log
  
# Path formats - matches Lidarr structure
paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Non-Album/$artist/$title
  comp: Compilations/$album%aunique{}/$track $title

# Plugins
plugins: 
  - fetchart      # Download album art
  - embedart      # Embed art in files
  - lastgenre     # Fetch genres from Last.fm
  - scrub         # Clean tags
  - replaygain    # Calculate ReplayGain for volume normalization
  - missing       # Track missing albums
  - duplicates    # Find duplicate tracks

# Plugin configurations

# ------------------------------------------------------------------------------
# SAFE-01 — destructive defaults, all three explicitly OFF (plan 01-07, 2026-08-18)
# ------------------------------------------------------------------------------
# All three of these were armed before this edit — embedart and lastgenre by an
# explicit affirmative value, and scrub by omission, which is the same thing:
# scrub.auto DEFAULTS to on in beets 2.13.1 and `scrub` is listed in the `plugins:`
# block above. Measured with `beet config -d`, not taken from documentation.
#
# Edited even though this container cannot currently run (its image is gone from
# GHCR and arrs/compose.yaml:38 has it commented out). Two reasons: Phase 4 deletes
# this stack, and deleting from a known-safe state is worth more than deleting from
# an unknown one; and a repo file that arms these plugins is a template someone copies.
#
# The `plugins:` list above is deliberately NOT edited here — Phase 4 owns it.

scrub:
  auto: no        # scrub STRIPS all existing tags on import. Was armed by omission.

embedart:
  auto: no        # embedart REWRITES the audio file to embed artwork. Was: yes.

lastgenre:
  auto: no        # lastgenre OVERWRITES genre from Last.fm. Was armed explicitly.
  source: album

fetchart:
  auto: no        # Not one of SAFE-01's three, turned off anyway (plan 01-07, Rule 2):
                  # fetchart writes cover.jpg INTO the album folder, which is the same
                  # sidecar pollution SAFE-05 just closed on Jellyfin, from a source the
                  # roadmap does not count. Was armed explicitly.
  cautious: yes

replaygain:
  auto: no  # Set to 'yes' if you want automatic ReplayGain calculation
  backend: ffmpeg

# File handling
replace:
  '[\\]': _
  '[/]': _
  '^\.': _
  '[\x00-\x1f]': _
  '[<>:"\?\*\|]': _
  '\.$': _
  '\s+$': ''

# Only import audio formats
ignore: 
  - .AppleDouble
  - ._*
  - .DS_Store
  - '*~'
  - .directory
  - Thumbs.db

# MusicBrainz settings
musicbrainz:
  enabled: yes
  
# Match settings
match:
  strong_rec_thresh: 0.04
  medium_rec_thresh: 0.25
  ignored_media: 
    - Data CD
    - DVD
    - DVD-Video
    - Blu-ray
    - HD-DVD
    - VCD
    - SVCD
    - UMD
    - VHS
