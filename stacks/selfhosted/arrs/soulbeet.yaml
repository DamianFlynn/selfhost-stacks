# Soulbeet - Automated Music Downloader and Organizer
#
# Purpose:
#   Searches and downloads music from Soulseek (via slskd)
#   Automatically organizes and tags music files with beets
#
# Key Features:
#   - Web-based search interface for Soulseek
#   - Integration with slskd for P2P downloads
#   - Automatic music tagging and organization with beets
#   - SQLite database for tracking downloads
#   - Music library management
#
# Workflow:
#   Search music → Queue download via slskd → Auto-tag with beets → Organize to library
#
# Access:
#   URL: https://soulbeet.deercrest.info
#   Middleware: chain-authelia (protected - admin only)
#

services:
  soulbeet:
    image: ghcr.io/terry90/soulbeet:v0.6.0
    container_name: soulbeet
    hostname: soulbeet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - t3_proxy
    ports:
      - "9765:9765"
    volumes:
      - /mnt/fast/appdata/arrs/soulbeet/data:/data:rw       # Database and app data
      - /mnt/tank/downloads:/downloads:rw                   # Download folder (shared with slskd)
      # NOTE (2026-08-18): this line previously carried NO suffix, which docker defaults to
      # read-write — soulbeet declared a read-write path straight at the music library.
      #
      # Why :ro now: the container cannot currently run (its image is gone from GHCR) and this
      # file is commented out of arrs/compose.yaml, so a running-container audit scores it green
      # either way. That is precisely the false pass. Uncommenting one include line would re-arm
      # a fifth writer against a library that by then holds the pilot import.
      #
      # What breaks if you revert it: nothing visible today, and a silent second writer the day
      # someone restores the image. Deletion belongs to Phase 4 under issue #306 — freeze it
      # here, retire it there. Do not "helpfully" restore the write access.
      - /mnt/tank/media/Music:/music:ro                     # Music library — READ-ONLY, see above
      # Custom beets config for existing library integration
      - /mnt/fast/appdata/arrs/soulbeet/beets_config.yaml:/app/beets_config.yaml:rw
    environment:
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
      - DATABASE_URL=sqlite:/data/soulbeet.db
      - SLSKD_URL=${SLSKD_URL:-http://slskd:5030}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_DOWNLOAD_PATH=/downloads
      - SECRET_KEY=${SOULBEET_SECRET_KEY}
    labels:
      - traefik.enable=true
      # HTTP Routers
      - traefik.http.routers.soulbeet.entrypoints=websecure
      - traefik.http.routers.soulbeet.rule=Host(`soulbeet.deercrest.info`)
      - traefik.http.routers.soulbeet.tls=true
      - traefik.http.routers.soulbeet.tls.certresolver=dns-cloudflare
      # Middlewares
      - traefik.http.routers.soulbeet.middlewares=chain-authelia@file
      # HTTP Services
      - traefik.http.routers.soulbeet.service=soulbeet-svc
      - traefik.http.services.soulbeet-svc.loadbalancer.server.port=9765
