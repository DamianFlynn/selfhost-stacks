# beets configuration for the SABnzbd post-processing pipeline
#
# Consumed by:
#   NOTHING. Since 2026-09-13 (plan 04-10, TAGR-04 / D-10) no code path reads this file.
#   The single invocation that ever did — the `beet … import -q` call in audio.bash — was
#   stripped in that plan, and audio.bash is itself now vendored beside this file at
#   ./audio.bash, so the removal is reviewable in git instead of living only on the host.
#
#   THIS FILE IS KEPT ANYWAY, AS A DEFUSED GUARD (D-11). Not dead weight and not an
#   oversight. The upstream arr-scripts setup.bash re-downloads beets-config.yaml from
#   GitHub on container start, and the replacement carries upstream's defaults — which arm
#   scrub.auto, lastgenre.auto AND embedart.auto (see SAFE-01 below) against a 34 GB library
#   with no undo. If this file and its bind mount were removed, a restored stock setup.bash
#   would quietly put that config back. Keeping a defused one, mounted `:ro`, is cheaper
#   than trusting that nobody ever reverts.
#
# VENDORED 2026-08-18 (plan 01-07, SAFE-01 / D-28). This file lived only on the host
# until now. The repo copy is for review and history; the compose mount in
# ../sabnzbd.yaml points at the appdata copy, which is authoritative at runtime.
# Same hybrid shape as ../beets/config.yaml, the surviving tagger's vendored config. See
# ../sabnzbd.yaml for the provenance NOTE and for what breaks if the mount is removed.
#
# Seeded verbatim from /mnt/fast/appdata/arrs/sabnzbd/config/scripts/beets-config.yaml
# (sha256 c12a811088319c850630a16414f785ad07a59194ea3b0d7e2d2db8e37be6f3d8,
#  mtime 2026-06-24). No credential of any kind was present. Screened for a Discogs
# user credential, for any field named after a credential class, for URLs carrying
# embedded credentials, for e-mail addresses, and for high-entropy strings. All seven
# checks returned clean, so nothing here is redacted and there is no placeholder to
# substitute. Re-screen before committing any future change to this file.

# --------------------------------------------------------------------------------
# FIXED 2026-09-13 by plan 04-10 (TAGR-05). This line read `plugins: embedart`.
# --------------------------------------------------------------------------------
# Since beets 2.4.0 MusicBrainz is itself a plugin, so a customised plugins list that
# omits `musicbrainz` silently disables autotagging entirely — the symptom looks like
# "no match found", never like a config error. That is why this one line matters, and
# why it is spelled out rather than left to a default. It was the confirmed cause of
# the 1 Aug, 8 Aug and 6 Sep 2026 ingest skips.
#
# "Confirmed" is no longer an inference. Plan 04-09 MEASURED it (D-17) on the D-29
# album, with two configs differing by exactly this line and everything else held
# constant — same album, same throwaway `-l`, same container, same image:
#     plugins: embedart              ->  0 MusicBrainz candidates  (0.4 s)
#     plugins: embedart musicbrainz  ->  1 MusicBrainz candidate   (Scarecrow, 12 of
#                                        12 tracks, distance 0.048, rec. strong)
# The zero arm ran against the LIVE broken host copy of this file BEFORE this fix
# landed. That ordering is the entire reason plan 04-10 runs after 04-09, and it is
# why plan 01-07 deliberately left the line broken rather than repairing it early.
#
# Nothing invokes this config any more (see the header), so this changes no behaviour
# today. It is fixed so the defused guard is a CORRECT config: if this file ever does
# repel a stock setup.bash re-download, what survives should be the working plugins
# line and not the broken one.
plugins: embedart musicbrainz

art_filename: folder
threaded: no
per_disc_numbering: yes
id3v23: no
asciify_paths: true

# --------------------------------------------------------------------------------
# Autotagger match thresholds (unchanged from the host original)
# --------------------------------------------------------------------------------
match:
    strong_rec_thresh: 0.10 # 0.04
    medium_rec_thresh: 0.25 # 0.25
    rec_gap_thresh: 0.25 # 0.25
    max_rec:
        missing_tracks: medium # medium
        unmatched_tracks: medium # medium
        track_length: medium
        track_index: medium
    distance_weights:
        source: 2.0 # 2.0
        artist: 3.0 # 3.0
        album: 3.0 # 3.0
        media: 1.0 # 1.0
        mediums: 1.0 # 1.0
        year: 1.0 # 1.0
        country: 0.5 # 0.5
        label: 0.5 # 0.5
        catalognum: 0.5 # 0.5
        albumdisambig: 0.5 # 0.5
        album_id: 5.0 # 5.0
        tracks: 2.0 # 2.0
        missing_tracks: 0.9 # 0.9
        unmatched_tracks: 0.6 # 0.6
        track_title: 3.0 # 3.0
        track_artist: 2.0 # 2.0
        track_index: 1.0 # 1.0
        track_length: 2.0 # 2.0
        track_id: 5.0 # 5.0
    preferred:
        countries: [] # []
        media: [] # []
        original_year: no # no
    ignored: ['missing_tracks', 'track_length', 'unmatched_tracks', 'track_index'] # []
    required: [] # []
    ignored_media: [] # []
    ignore_data_tracks: yes # yes
    ignore_video_tracks: yes # yes
    track_length_grace: 10 # 10
    track_length_max: 30 # 30

# --------------------------------------------------------------------------------
# Path formats (unchanged). audio.bash passes -d "$1", so these are relative to the
# download folder being processed — this pipeline tags in place and never writes to
# /mnt/tank/media/Music.
# --------------------------------------------------------------------------------
paths:
    default: $disc$track - $title
    singleton: $disc$track - $title
    comp: $disc$track - $title
    albumtype_soundtrack: $disc$track - $title

# --------------------------------------------------------------------------------
# Import behaviour (unchanged from the host original)
# --------------------------------------------------------------------------------
import:
    write: yes
    copy: no
    move: no
    resume: ask
    incremental: no
    quiet_fallback: skip
    timid: no
    duplicate_action: skip
    # KEEP-WITH-REASON (D-10 scope). Nothing writes this path any more — its only writer
    # was the stripped invocation. Left exactly as it was because D-10 authorises one line
    # of change to this pipeline and Phase 8 owns the hook's eventual shape. The host file
    # /config/scripts/beets.log is deleted separately by plan 04-11.
    log: /config/scripts/beets.log
    languages: ['en']
    group_albums: no

# --------------------------------------------------------------------------------
# SAFE-01 — destructive defaults, all three explicitly OFF (plan 01-07, 2026-08-18)
# --------------------------------------------------------------------------------
# Every one of these keys defaults to `yes` in beets 2.13.1. Measured, not assumed:
#
#     beet -c <cfg naming the plugin> -l /tmp/throwaway.blb config -d
#       scrub.auto      -> yes
#       lastgenre.auto  -> yes
#       embedart.auto   -> yes
#
# So an ABSENT key is not an off switch — it is the on switch, waiting for someone to
# add the plugin name to the `plugins:` line above. Two of these three plugins are not
# enabled here today; the keys are set anyway, precisely so that enabling a plugin
# later cannot silently re-arm automatic tag destruction.
#
# There is no `beet undo`. These run against a 34 GB library that is already correctly
# tagged and a 97 GB backlog carrying irreplaceable DJ metadata that exists nowhere
# else. Reversal is a ZFS rollback, not a command.

scrub:
    auto: no   # scrub STRIPS all existing tags from a file on import. Off: this pipeline
               # ingests content whose existing tags are the only metadata it has.

lastgenre:
    auto: no   # lastgenre OVERWRITES the genre field from Last.fm. Off: it discards
               # hand-curated and DJ-service genre data in favour of crowd tags.

embedart:
    auto: no   # embedart REWRITES the audio file to embed cover artwork. Off: a file
               # rewrite is the one operation here that can corrupt the stream itself.
               # (This was already `no` on the host — the only one of the three that was.)
