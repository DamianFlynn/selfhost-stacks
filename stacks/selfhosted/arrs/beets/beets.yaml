  ### Beets.io — THE DORMANT, AGENT-DRIVEN CLI ARM (D-12)
#
# WHAT THIS CONTAINER IS FOR, written here on 2026-09-20 (plan 06-04, D-12) because an
# unstated purpose is how a spare tagger turns into a second pipeline — and a fourth
# half-built tagging path is the one outcome this project exists to prevent.
#
# It is the SCRIPTED/AGENT arm. It exists so a bot can drive `beet` on the command line. The
# operator's own words at the Phase 3 decision: *"It's fine for a bot to drive us, but for me,
# as a human, no."* The HUMAN arm is beets-flask's web UI (./flask.yaml) — that is the ACTIVE
# runtime, it is what watches the three registered inboxes, and it is what generates previews.
#
# Everything that keeps it dormant is deliberate and stays:
#   * `restart: "no"` and `profiles: ["manual"]` — it never comes up on a daemon restart and is
#     never swept in by a bare `docker compose up`.
#   * commented out of ../compose.yaml's include list.
#   * `/mnt/tank/media:/media:ro` — see the D-05 note further down.
#
# AND IT ALWAYS PASSES AN EXPLICIT THROWAWAY `-l`, PLUS A `-c` OVERLAY (D-04). Not a habit — a
# requirement. One `library.db` is mounted into two beets versions (D-03), and this image is
# 2.13.1 while beets-flask executes 2.12.0. A bare `beet` here would OPEN that database and
# MIGRATE ITS SCHEMA under 2.12.0's feet; Phase 1 measured a bare `beet config` running 11
# migrations unasked. And `-l` ALONE IS NOT ENOUGH: it redirects `library:` but NOT
# `statefile:`, which is a separate pickle holding the incremental-import marks. So the overlay
# must set `library`, `statefile` AND `directory`, e.g.
#
#   docker compose -f beets/beets.yaml --profile manual run --rm beets \
#     beet -l /tmp/throwaway.db -c /tmp/throwaway-overlay.yaml <command>
#
# ACCEPTED CONSEQUENCE, stated rather than discovered: the CLI arm reads a throwaway library, so
# IT CANNOT ANSWER "what is in the library". Flask's UI does that. If you find yourself reaching
# for this container to run real imports — or removing the `-l` so it can see the real database —
# stop: you have re-created the exact failure this project exists to prevent.
services:

  beets:
    hostname: beets
    image: lscr.io/linuxserver/beets:2.13.1-ls349
    container_name: beets
    security_opt:
      - no-new-privileges:true
    restart: "no"  # Don't run 24/7, start manually or via cron
    profiles: ["manual"]  # Exclude from 'docker compose up'
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    volumes:
      - /mnt/fast/appdata/arrs/beets/config:/config:rw  # Application config and library.db
      # beets config. NOTE (2026-09-11): beets/config.yaml is now VENDORED in this repo
      # (plan 04-08, TAGR-05 / D-27). It is this container's own beets configuration at
      # /config/config.yaml — the file every `beet` invocation inside it reads unless a
      # `-c` overlay is passed. It declares `plugins: musicbrainz`, an explicit
      # `library: /config/library.db`, and the three SAFE-01 `auto: no` keys.
      #
      # Why it is vendored: TAGR-05 requires that every remaining beets config declares
      # `musicbrainz`, and a config that exists only on the host cannot be checked in git.
      # Note what this mount does NOT do — it does not preserve an existing configuration.
      # The host file it replaces was not a beets config at all: it was a pasted compose
      # SERVICE DEFINITION with no `plugins:`, `library:` or `directory:` key anywhere in
      # it (04-RESEARCH.md F4). This installs the survivor's first real config.
      #
      # What breaks if you revert it: the container falls back to LinuxServer's default
      # beets config, which ARMS scrub.auto, lastgenre.auto and embedart.auto — all three
      # default to `yes` in 2.13.1 — and OMITS `musicbrainz` from its `plugins:` line.
      # That is the worst of both: no metadata source at all, so every album skips, and
      # three automatic tag-destroying plugins armed against a 34 GB library and a 97 GB
      # backlog, with no `beet undo`.
      #
      # How much :ro protects, and what BOOT actually did. It makes the file read-only
      # to the container, which is the half the sabnzbd :rw mount does not cover: that one
      # was measured on 2026-08-18 to block `mv tmp dest` (EBUSY) but NOT in-place `> dest`
      # truncation (../sabnzbd.yaml:80-90). The open question was BOOT, not tamper —
      # LinuxServer images run an `lsiown -R abc:abc /config` pass at start, which may log
      # EROFS against this single-file mount.
      #
      # MEASURED 2026-09-11 (plan 04-09), superseding this block's previous "UNMEASURED at
      # this commit". The survivor was started twice on its `manual` profile at
      # 2.13.1-ls349 with this mount in place. Across 175 container log lines there were
      # ZERO `Read-only file system`, ZERO `Permission denied`, ZERO `lsiown` and ZERO
      # `chmod` lines; it reached `running` both times, reported `User UID/GID 568`, and
      # `docker inspect` showed `/config/config.yaml RW=false` alongside `/media RW=false`.
      # :ro therefore STAYS. No EROFS line had to be tolerated under the D-09 rule, and
      # nothing justified flipping this line to :rw.
      #
      # What DID bite, recorded so nobody rediscovers it: `.State.Status` reports `running`
      # IMMEDIATELY, before s6 has remapped `abc` to PUID. A `docker exec` issued in that
      # window runs as the image-default uid and takes EACCES on this 0770 apps-owned file
      # ("configuration error: /config/config.yaml could not be read: [Errno 13] Permission
      # denied") — and in the same window `docker logs` is still EMPTY, so an EROFS grep
      # taken there reads a false "(none)". Gate on
      # `docker exec -u abc … test -r /config/config.yaml`, never on `running` alone.
      - /mnt/fast/appdata/arrs/beets/config/config.yaml:/config/config.yaml:ro  # Vendored beets config (see above)
      - /mnt/tank/downloads:/downloads:rw  # Import source — backlog staging area
      # NOTE (2026-08-18): :ro is deliberate (D-20). Nobody holds read-write on
      # /mnt/tank/media/Music during Phases 1-3, including this container. Phase 3 chooses
      # the one tagger and Phase 6 grants it rw — that is the first time anything holds it
      # again. Until then beets can read the library for match context but cannot write it.
      # If you flip this back to :rw to "just run one import", you have re-created the exact
      # failure this project exists to prevent: a fourth half-built tagging path.
      #
      # CORRECTED 2026-09-20, plan 06-04, D-05. The third sentence above — "Phase 3 chooses the
      # one tagger and Phase 6 grants it rw" — IS WRONG. It is kept visible rather than deleted,
      # per this repo's standing style for a retracted claim (beets.md:70-77, "Stated as
      # retractions, not quiet replacements"). The correct statement:
      #
      #   /mnt/tank/media stays :ro for the ENTIRE of Phase 6, for BOTH containers — this one and
      #   beets-flask (./flask.yaml). Granting rw is PHASE 7'S FIRST ACT, done deliberately with
      #   the snapshot fence already in place.
      #
      # Why the correction matters rather than being a date fix: Phase 6's whole claim is that it
      # "wrote nothing", and a read-only mount is the only evidence for that which CANNOT FAIL
      # OPEN. Phase 1 measured a path-set comparison returning a perfect pass while Jellyfin
      # rewrote 83 of 91 .nfo files underneath it. A comment promising rw in the current phase is
      # an invitation to flip the flag one plan early and lose the only structural control.
      # The final sentence of the 2026-08-18 note stands unchanged and applies to both containers.
      #
      # CORRECTED 2026-09-26, plan 07-08, D-22. The trailing comment on the mount line below used to
      # read "Existing library — READ-ONLY for all of Phase 6; rw is Phase 7's first act". Phase 7
      # granted rw to beets-flask ONLY (D-22, plan 07-08; ./flask.yaml). THIS dormant arm stays :ro:
      # it never opens the real library.db (Phase 6 D-04), so it has no sanctioned write, and granting
      # it rw would create an unsanctioned second writer — and turn check-music-freeze.sh's mount
      # census red the first time anyone started it. Plan 07-09's gate keeps a `grant-both` override;
      # flask-only is the decided default (07-CONTEXT D-22, ratified 2026-09-25).
      - /mnt/tank/media:/media:ro  # Phase 7 granted rw to beets-flask ONLY (D-22, plan 07-08); this dormant arm stays :ro — it never opens the real library.db (Phase 6 D-04), so it has no sanctioned write
    # WR-02: THE networks: KEY AND THE HOST PORT ARE THE SAME DEFECT, SEEN FROM TWO SIDES.
    # Until 2026-09-14 this key was COMMENTED OUT while `traefik.enable=true` and a full
    # `chain-authelia@file` router sat in the labels below. Compose therefore attached this
    # service to the implicit project `default` network, where the Traefik container cannot
    # reach it — so the Authelia protection was ILLUSORY, and the one path that did work,
    # `ports: - 8337:8337`, published the container LAN-WIDE WITH NO AUTHENTICATION.
    #
    # It was an outlier, not a convention: of the 16 files under stacks/selfhosted/arrs/, this
    # was the ONLY one with traefik.enable=true and no network. Every sibling declares one.
    #
    # NOT EXPLOITABLE AT THE COMMIT THAT FIXED IT, AND THAT IS WHY IT WAS FIXED THEN. config.yaml
    # declares `plugins: musicbrainz` only, so the `web` plugin never loads and nothing listens
    # on 8337; the service is `restart: "no"`, `profiles: ["manual"]`, and commented out of
    # ../compose.yaml's include list. It becomes a live unauthenticated LAN exposure THE MOMENT
    # Phase 5/6 enables `web` — on a container holding /downloads:rw — and the person enabling
    # `web` is not the person who would think to check this file for a stray host port.
    networks:
      - t3_proxy
    # THE HOST PORT IS DELIBERATELY GONE. Reach beets through Traefik + Authelia at
    # beets.deercrest.info, which is what the labels below have always claimed. If a host port is
    # ever genuinely needed for local debugging, bind it to LOOPBACK — `- "127.0.0.1:8337:8337"` —
    # never to all interfaces. Do not restore the bare form.
    # ports:
    #   - 8337:8337
    # THE TRAEFIK LABELS ARE DELETED, NOT COMMENTED OUT (2026-09-20, plan 06-04, D-07).
    # Removed: `traefik.enable=true`, the seven `routers.beets.*` labels (entrypoints, the
    # Host(`beets.deercrest.info`) rule, the chain-authelia@file middleware, tls,
    # tls.certresolver, priority, service) and `services.beets-svc.loadbalancer.server.port`.
    # They MOVED to ./flask.yaml, unchanged except the port: 5001, not 8337. 8337 was the beets
    # `web` plugin's port, and that plugin is not even loaded — config.yaml declares
    # `plugins: [musicbrainz]` only.
    #
    # WHY: ONE HOSTNAME, ONE ROUTER. Two services claiming Host(`beets.deercrest.info`) is a
    # coin-toss for which one Traefik binds and a self-inflicted outage on the one that matters.
    # Router and service names were kept as `beets`/`beets-svc` over there so the existing
    # Cloudflare record and the issued certificate keep working.
    #
    # Deleted rather than commented out because a commented-out router is one uncomment away from
    # coming back, and this container is dormant — nobody would be looking at this file when the
    # UI broke. The `networks:` key and the host-port note above are KEPT: they are correct
    # independent of the labels, and the WR-02 defect they record was about this file specifically.

# WR-02: t3_proxy declared here as well as in ../compose.yaml, because this file has to stand on
# its own. It is commented out of that file's include list (../compose.yaml:39), so when it is
# brought up directly on its `manual` profile there is no parent to inherit the network from.
# Same shape as blockbusterr.yaml — which IS included, and declares t3_proxy itself anyway, so an
# identical repeated external declaration is proven to merge cleanly rather than conflict.
networks:
  t3_proxy:
    external: true

