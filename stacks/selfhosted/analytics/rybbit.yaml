# Rybbit services, pinned to the upstream v2.9.3 docker-compose.yml.
# Service and container names are prefixed `rybbit-`: upstream's bare postgres/redis/backend/client
# names collide estate-wide, and bare DNS names would be ambiguous on t3_proxy.
# No ports are published; Traefik fronts backend and client, the databases live on `analytics` only.
# Upgrades: backend, client and ClickHouse move together to the versions in the upstream compose at
# the new tag (backend runs migrations on start). Renovate group `rybbit`, manual review.

services:
  rybbit-clickhouse:
    # renovate: datasource=docker depName=clickhouse/clickhouse-server
    image: clickhouse/clickhouse-server:26.11.4.11
    container_name: rybbit-clickhouse
    restart: unless-stopped
    networks:
      - analytics
    volumes:
      - rybbit_clickhouse:/var/lib/clickhouse
      # Files rather than compose `configs:` (the repo uses none). Profile settings are only read
      # from users.d, so the second file is required.
      - ./clickhouse/config.d/rybbit.xml:/etc/clickhouse-server/config.d/rybbit.xml:ro
      - ./clickhouse/users.d/rybbit.xml:/etc/clickhouse-server/users.d/rybbit.xml:ro
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
      # The backend always connects to ClickHouse as the default user.
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set in stacks/selfhosted/analytics/.env}
      # Lets the backend provision the least-privilege `rybbit_query` user at startup.
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1536m
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rybbit-postgres:
    # Upstream pin. Not the repo's usual postgres:18-alpine: PG18's data path differs and upstream
    # tests 17.
    # renovate: datasource=docker depName=postgres
    image: postgres:17.12
    container_name: rybbit-postgres
    restart: unless-stopped
    networks:
      - analytics
    volumes:
      - rybbit_postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rybbit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in stacks/selfhosted/analytics/.env}
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m

  rybbit-redis:
    # renovate: datasource=docker depName=redis
    image: redis:8.12.0-alpine
    container_name: rybbit-redis
    restart: unless-stopped
    networks:
      - analytics
    volumes:
      - rybbit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set in stacks/selfhosted/analytics/.env}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Upstream: backs session tracking, sticky identity, and bot-anomaly counters.
    # noeviction keeps those keys from being dropped under memory pressure; session keys carry a
    # 30-minute TTL so memory stays bounded by active-user count. AOF (everysec) keeps that state
    # durable across restarts.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in stacks/selfhosted/analytics/.env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    mem_limit: 256m

  rybbit-backend:
    # renovate: datasource=docker depName=ghcr.io/rybbit-io/rybbit-backend
    image: ghcr.io/rybbit-io/rybbit-backend:v2.9.3
    container_name: rybbit-backend
    restart: unless-stopped
    networks:
      - t3_proxy
      - analytics
    environment:
      - NODE_ENV=production
      - CLICKHOUSE_HOST=http://rybbit-clickhouse:8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set in stacks/selfhosted/analytics/.env}
      - CLICKHOUSE_QUERY_PASSWORD=${CLICKHOUSE_QUERY_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      - POSTGRES_HOST=rybbit-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER:-rybbit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in stacks/selfhosted/analytics/.env}
      - REDIS_HOST=rybbit-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set in stacks/selfhosted/analytics/.env}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set in stacks/selfhosted/analytics/.env}
      - BASE_URL=${BASE_URL:-https://pulse.deercrest.info}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - DISABLE_TELEMETRY=${DISABLE_TELEMETRY:-true}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
      # Upstream default is 4 forked Node workers; one is ample for a few personal sites and saves
      # memory on LXC 100.
      - CLUSTER_WORKERS=${CLUSTER_WORKERS:-1}
      - DEPLOYMENT=${DEPLOYMENT:-}
      - LITE_DASHBOARD=${LITE_DASHBOARD:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
    depends_on:
      rybbit-clickhouse:
        condition: service_healthy
      rybbit-postgres:
        condition: service_healthy
      rybbit-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=t3_proxy"

      # PUBLIC tracking router - no Authelia (D-04). default-headers@file ONLY: NOT chain-no-auth,
      # because secure-headers' CORS options make Traefik answer the /api/track preflight itself
      # without POST. The backend's own CORS reflects any origin on these paths.
      # Paths, from upstream v2.9.3 source:
      #   /api/script.js, /api/replay.js, /api/metrics.js  - server/src/index.ts (script, rrweb, web vitals)
      #   /api/track, /api/identify                        - analytics-script/tracking.ts + index.ts
      #   /api/session-replay/record/{siteId}              - analytics-script/sessionReplay.ts + index.ts
      #   /api/site/tracking-config/{siteId}               - analytics-script/config.ts + index.ts
      #   /api/site/{siteId}/feature-flags/evaluate        - lib/cors.ts isPublicCorsPath + index.ts
      # Deliberately NOT public: sessions / embed-stats (public dashboard and embed widgets, not
      # offered here), /api/site/check-install, /api/version.
      - "traefik.http.routers.rybbit-track.entrypoints=web,websecure"
      - "traefik.http.routers.rybbit-track.priority=100"
      - "traefik.http.routers.rybbit-track.rule=Host(`pulse.deercrest.info`) && (Path(`/api/script.js`) || Path(`/api/replay.js`) || Path(`/api/metrics.js`) || Path(`/api/track`) || Path(`/api/identify`) || PathPrefix(`/api/session-replay/record/`) || PathPrefix(`/api/site/tracking-config/`) || PathRegexp(`^/api/site/[^/]+/feature-flags/evaluate$`))"
      - "traefik.http.routers.rybbit-track.middlewares=default-headers@file"
      - "traefik.http.routers.rybbit-track.service=rybbit-backend"

      # API-KEY router (2026-11-22) - lets AI/agent clients read stats and use Rybbit's MCP server
      # from outside without an Authelia session. Matches ONLY requests carrying
      # `Authorization: Bearer rb_...` AND either a GET under /api/sites/ (stats API) or a POST to
      # /api/mcp (server/src/mcp/index.ts). Rybbit itself verifies the key (auth.api.verifyApiKey),
      # so a forged header gets 401; the key's own scopes bound what it can do - hand agents
      # read-only keys. Signup, auth and admin paths never match this rule and stay behind
      # Authelia via rybbit-api below.
      - "traefik.http.routers.rybbit-keyapi.entrypoints=web,websecure"
      - "traefik.http.routers.rybbit-keyapi.priority=75"
      - "traefik.http.routers.rybbit-keyapi.rule=Host(`pulse.deercrest.info`) && HeaderRegexp(`Authorization`, `^Bearer rb_[A-Za-z0-9_-]+$`) && ((Method(`GET`) && PathPrefix(`/api/sites/`)) || (Method(`POST`) && Path(`/api/mcp`)))"
      - "traefik.http.routers.rybbit-keyapi.middlewares=rate-limit@file,default-headers@file"
      - "traefik.http.routers.rybbit-keyapi.service=rybbit-backend"

      # GATED API router - everything else the backend serves.
      - "traefik.http.routers.rybbit-api.entrypoints=web,websecure"
      - "traefik.http.routers.rybbit-api.priority=50"
      - "traefik.http.routers.rybbit-api.rule=Host(`pulse.deercrest.info`) && (PathPrefix(`/api`) || PathPrefix(`/.well-known/oauth-`) || PathPrefix(`/.well-known/openid-configuration`))"
      - "traefik.http.routers.rybbit-api.middlewares=chain-authelia@file"
      - "traefik.http.routers.rybbit-api.service=rybbit-backend"

      - "traefik.http.services.rybbit-backend.loadbalancer.server.port=3001"

  rybbit-client:
    # renovate: datasource=docker depName=ghcr.io/rybbit-io/rybbit-client
    image: ghcr.io/rybbit-io/rybbit-client:v2.9.3
    container_name: rybbit-client
    restart: unless-stopped
    # Proxy network only: the client reaches the backend through the public URL, as upstream does.
    networks:
      - t3_proxy
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${BASE_URL:-https://pulse.deercrest.info}
      - NEXT_PUBLIC_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - NEXT_PUBLIC_DEPLOYMENT=${DEPLOYMENT:-}
      - NEXT_PUBLIC_LITE_DASHBOARD=${LITE_DASHBOARD:-}
    depends_on:
      rybbit-backend:
        condition: service_healthy
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=t3_proxy"

      # Dashboard - Authelia, then Rybbit's own login.
      - "traefik.http.routers.rybbit.entrypoints=web,websecure"
      - "traefik.http.routers.rybbit.priority=10"
      - "traefik.http.routers.rybbit.rule=Host(`pulse.deercrest.info`)"
      - "traefik.http.routers.rybbit.middlewares=chain-authelia@file"
      - "traefik.http.routers.rybbit.service=rybbit-client"
      - "traefik.http.services.rybbit-client.loadbalancer.server.port=3002"
