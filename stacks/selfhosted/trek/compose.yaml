# TREK Stack - Self-hosted travel and trip planner
# https://github.com/liketrek/TREK
#
# Single service, SQLite-backed. No published host port: cal-web (keeper-sh)
# already owns 127.0.0.1:3000, so TREK is reachable through Traefik only.

name: trek

########################### NETWORKS
networks:
  t3_proxy:
    external: true

include:
  ########################### SERVICES
  - trek.yaml

########################### STATE
# No named volumes. /app/data (SQLite) and /app/uploads bind to
# /mnt/fast/appdata/trek/{data,uploads}, which is its own ZFS dataset
# `fast/appdata/trek` (LXC mp33, default 128K recordsize), snapshotted and sent to
# the backup pool nightly. /mnt/fast/appdata itself is NOT a mountpoint (MEDIA.md
# 3), so this only escapes LXC 100's ext4 root because of that dataset. Moved off
# the trek_data/trek_uploads named volumes by 261022-cg6; both subdirs are owned
# 1000:1000 as the volumes were.
