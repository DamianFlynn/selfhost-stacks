# Open WebUI Stack - AI chat interface with LLM integration
# Self-hosted ChatGPT-style interface for local and cloud AI models

name: openwebui

########################### NETWORKS
networks:
  t3_proxy:
    name: t3_proxy
    external: true
  openwebui:
    name: openwebui
    driver: bridge

services:

  # PostgreSQL database with pgvector extension for AI embeddings
  # Internal service - no direct web access
  # Connect via: postgresql://owui-user:171d29d40f07946b@localhost:5432/owui (when port exposed)
  ai-postgress:
    container_name: ai-postgress
    # renovate: datasource=docker depName=pgvector/pgvector
    image: pgvector/pgvector:0.8.6-pg18
    pull_policy: always
    restart: unless-stopped
    environment:
      - POSTGRES_DB=owui
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=owui-user
    volumes:
      - /mnt/fast/appdata/llm-ai/postgres:/var/lib/postgresql
    networks:
      - openwebui
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test: ["CMD-SHELL", "pg_isready -d owui -U owui-user"]
      timeout: 5s

  # Redis Stack with search, JSON, time series, and bloom filter modules
  # Web UI available at: http://localhost:8001 (if port exposed)
  # Internal service for caching and session management
  ai-redis:
    container_name: ai-redis
    # renovate: datasource=docker depName=redis/redis-stack
    image: redis/redis-stack:7.4.0-v8
    pull_policy: always
    restart: unless-stopped
    environment:
      - RI_PROXY_PATH=redis
    networks:
      - openwebui
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      timeout: 3s

  # Ollama AI model server with AMD GPU (ROCm) acceleration
  # Public API: https://ollama.deercrest.info
  # Internal API: http://ai-ollama:11434
  # Manages and runs local LLMs (Large Language Models)
  # Useful for Home Assistant AI integration
  ai-ollama:
    container_name: ai-ollama
    # renovate: datasource=docker depName=ollama/ollama
    image: ollama/ollama:0.34.4     # AMD Ryzen AI 9 HX PRO 370 with Radeon 890M (gfx1150) + Vulkan
    pull_policy: always
    environment:
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_DEBUG=0
      - OLLAMA_FLASH_ATTENTION=true
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_LOAD_TIMOUT=10m
      - OLLAMA_MLOCK=true
      - OLLAMA_MMAP=true
      - OLLAMA_NUM_GPU=1
      - OLLAMA_NUM_THREAD=0
      - OLLAMA_VULKAN=true

    ports:
      - "11434:11434"
    volumes:
      - /mnt/fast/appdata/llm-ai/ollama:/root/.ollama
    # For AMD GPU (Vulkan), works in unprivileged LXC:
    group_add:
      - "44"
      - "110"
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      - t3_proxy
      - openwebui
    labels:
      - "traefik.enable=true"
      # ─────────────────────────────────────────────────────────────────────────────────────
      # INTERNAL + TAILNET ONLY. OLLAMA HAS NO AUTHENTICATION OF ANY KIND.
      #
      # Until 2026-09-26 this router had NO middleware, so the whole Ollama API was open to the
      # internet. Measured, not inferred: `GET https://ollama.deercrest.info/api/tags` returned
      # the model list and `/api/version` returned {"version":"0.34.4"} from off-network. Ollama
      # ships no auth, so that exposed, to anyone who found the name:
      #   - unlimited inference on this box's hardware (compute theft), and GPU inference is the
      #     implicated trigger in the amdgpu HMM kernel oops that took the estate down for ~6 h
      #     on 2026-08-31 (see README § GPU Hardware Acceleration);
      #   - POST /api/pull to fill the disk — directly against the D-17 `/` headroom floor;
      #   - DELETE /api/delete to remove models; POST /api/create to add them.
      #
      # An ipallowlist, not Authelia: API clients cannot complete an SSO redirect, and the
      # internal consumer is unaffected either way because open-webui talks to
      # http://ai-ollama:11434 directly on the docker network and never traverses Traefik.
      # Off-LAN access is already provided properly by tsbridge (`service=ollama` on the
      # tailnet), which is why the public route was redundant as well as dangerous.
      #
      # Traefik matches the immediate peer address, so a request arriving through the Cloudflare
      # proxy presents a Cloudflare edge IP and is denied by construction.
      #
      # Evidence it was unused before removal: ai-ollama's own GIN log showed 10 requests in 24 h
      # total. NOTE the limit of the Traefik access log as evidence here — it is filtered to
      # statusCodes 204-299,400-499,500-599, so a plain 200 is NEVER written. Zero lines for this
      # host proves no 4xx/5xx, NOT no successful access. Do not cite it as proof of no traffic.
      #
      # To revert deliberately, remove the two middleware lines — but read the paragraph above
      # first, because unauthenticated inference is the default state of this software.
      - "traefik.http.routers.ollama-rtr.entrypoints=websecure"
      - "traefik.http.routers.ollama-rtr.rule=Host(`ollama.deercrest.info`)"
      - "traefik.http.routers.ollama-rtr.middlewares=ollama-internal-only"
      - "traefik.http.middlewares.ollama-internal-only.ipallowlist.sourcerange=172.16.1.0/24,100.64.0.0/10,127.0.0.1/32"
      - "traefik.http.routers.ollama-rtr.tls=true"
      - "traefik.http.routers.ollama-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.ollama-svc.loadbalancer.server.port=11434"

      - "tsbridge.enabled=true"
      - "tsbridge.service.name=ollama"                  # Default: container name
      - "tsbridge.service.port=11434"                   # Port inside the container
      - "tsbridge.service.access_log=false"             # Disable access log
      - "tsbridge.service.tags=tag:dev,tag:prod"        # Override default tags
      - "tsbridge.service.whois_enabled=true"           # Add identity headers
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 10s
      test: ps aux | grep  -v grep | grep '/bin/ollama serve' || exit 1
      timeout: 5s

  # Docling document processing server
  # Public web UI: https://docling.deercrest.info/ui
  # Public API docs: https://docling.deercrest.info/docs
  # Internal API: http://ai-docling:5001
  # Converts documents (PDF, Word, etc.) to structured formats
  # Useful for external document processing integrations
  ai-docling:
    container_name: ai-docling
    # measured 912 MB 2026-09-06; cap bounds a runaway, not steady state
    mem_limit: 2g
    # renovate: datasource=docker depName=quay.io/docling-project/docling-serve
    image: quay.io/docling-project/docling-serve:v1.35.0
    pull_policy: always
    restart: unless-stopped
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
    networks:
      - t3_proxy
      - openwebui
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docling-rtr.entrypoints=websecure"
      - "traefik.http.routers.docling-rtr.rule=Host(`docling.deercrest.info`)"
      - "traefik.http.routers.docling-rtr.tls=true"
      - "traefik.http.routers.docling-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.docling-svc.loadbalancer.server.port=5001"

      - "tsbridge.enabled=true"
      - "tsbridge.service.name=docling"                 # Default: container name
      - "tsbridge.service.port=5001"                    # Port inside the container
      - "tsbridge.service.access_log=false"             # Disable access log
      - "tsbridge.service.tags=tag:dev,tag:prod"        # Override default tags
      - "tsbridge.service.whois_enabled=true"           # Add identity headers
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 10s
      test: wget -qO- http://127.0.0.1:5001/health > /dev/null || exit 1
      timeout: 5s

  # Edge TTS (Text-to-Speech) service using Microsoft Edge voices
  # API available at: http://localhost:5050/v1 (if port exposed)
  # Provides realistic AI voice synthesis
  ai-edgetts:
    container_name: ai-edgetts
    # renovate: datasource=docker depName=travisvn/openai-edge-tts
    image: travisvn/openai-edge-tts:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - DEFAULT_RESPONSE_FORMAT=mp3
      - DEFAULT_SPEED=1.0
      - DEFAULT_VOICE=en-AU-NatashaNeural
    networks:
      - openwebui

  # MCP (Model Context Protocol) OpenAPI Proxy
  # Public web interface: https://mcp.deercrest.info
  # Internal API: http://ai-openwebui-mcp:8000
  # Provides tool integrations (time, database queries, etc.)
  # Can be used with VS Code MCP extensions and other MCP clients
  # Extensible with custom MCP servers via config.json
  ai-openwebui-mcp:
    container_name: ai-openwebui-mcp
    # renovate: datasource=docker depName=ghcr.io/open-webui/mcpo versioning=loose
    image: ghcr.io/open-webui/mcpo:main
    pull_policy: always
    restart: unless-stopped
    command: --config /app/conf/config.json
    environment:
      - DATABASE_URL=postgresql://owui-user:171d29d40f07946b@ai-postgress/owui
      - TIMEZONE=Etc/UTC
    volumes:
      - /mnt/fast/appdata/llm-ai/open-webui/conf/mcp:/app/conf:ro
    networks:
      - t3_proxy
      - openwebui
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-rtr.entrypoints=websecure"
      - "traefik.http.routers.mcp-rtr.rule=Host(`mcp.deercrest.info`)"
      - "traefik.http.routers.mcp-rtr.tls=true"
      - "traefik.http.routers.mcp-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.mcp-svc.loadbalancer.server.port=8000"

      - "tsbridge.enabled=true"
      - "tsbridge.service.name=mcp"                     # Default: container name
      - "tsbridge.service.port=8000"                    # Port inside the container
      - "tsbridge.service.access_log=false"             # Disable access log
      - "tsbridge.service.tags=tag:dev,tag:prod"        # Override default tags
      - "tsbridge.service.whois_enabled=true"           # Add identity headers
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 5s
      test: "curl -fsSL http://127.0.0.1:8000/time/get_current_time -H 'Content-Type: application/json' -d '{\"timezone\": \"Europe/Dublin\"}' | grep -v grep | grep 'timezone' || exit 1"
      timeout: 5s

  # SearXNG privacy-focused search engine
  # Public web interface: https://search.deercrest.info
  # Internal API: http://ai-searxng:8080
  # Aggregates results from multiple search engines without tracking
  # Use as default search engine in browsers
  ai-searxng:
    container_name: ai-searxng
    # renovate: datasource=docker depName=searxng/searxng
    # 2026.9.23 or newer is REQUIRED, not cosmetic. The 2026-09-04 release migrated
    # outgoing HTTP from httpx to curl_cffi, which added browser TLS/JA3 impersonation --
    # the actual mitigation for the DuckDuckGo/Brave/Startpage CAPTCHAs and 429s this
    # instance was serving on 2026.6.23. `impersonate` is set in engine code and is NOT
    # admin-configurable, so the fix comes from the image, never from settings.yml.
    image: searxng/searxng:2026.9.23-3cd69d30e
    pull_policy: always
    restart: unless-stopped
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    environment:
      - SEARXNG_BASE_URL=https://search.deercrest.info
      # SearXNG migrated Redis -> Valkey (PR #4795); `redis.url` is still read but emits a
      # DeprecationWarning and `valkey.url` wins. The valkey:// SCHEME is deliberate --
      # whether valkey-py's from_url() parses a redis:// scheme was not verified, and the
      # scheme sidesteps the question. The ai-redis server itself is RESP-compatible and
      # stays as-is; only the client library and URL scheme changed.
      - SEARXNG_VALKEY_URL=valkey://ai-redis:6379/1
      - SEARXNG_SECRET=a2bdf40d27a71225
    volumes:
      - /mnt/fast/appdata/llm-ai/searxng:/etc/searxng
      # Persistent cache (faviconcache.db, engine caches). Previously unmounted, so every
      # `docker compose up` threw this away and made SearXNG re-fetch from upstream --
      # extra requests against engines that are already rate-limiting this WAN IP.
      - /mnt/fast/appdata/llm-ai/searxng-cache:/var/cache/searxng

    depends_on:
      - ai-redis
    networks:
      - t3_proxy
      - openwebui
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng-rtr.entrypoints=websecure"
      - "traefik.http.routers.searxng-rtr.rule=Host(`search.deercrest.info`)"
      - "traefik.http.routers.searxng-rtr.tls=true"
      - "traefik.http.routers.searxng-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.searxng-svc.loadbalancer.server.port=8080"

      # --- External JSON API is blocked on purpose -------------------------------------
      # settings.yml enables `formats: [html, json]` because Open WebUI consumes the JSON
      # API -- but it reaches it INTERNALLY on http://ai-searxng:8080, so format=json never
      # needs to be reachable from the internet. Left public it would be an open,
      # unauthenticated, trivially scriptable search API whose every request is laundered
      # through this residential WAN IP into Google/Brave/DDG: the exact feedback loop that
      # gets the upstream engines to serve CAPTCHAs.
      #
      # SearXNG's own limiter CANNOT defend this. Its botdetection rejects any request whose
      # Accept header lacks text/html (searx/botdetection/http_accept.py) and blocks Python
      # user agents (http_user_agent.py), so every JSON client is a bot by definition and
      # `limiter: true` would break Open WebUI instead. There is no format=json exemption.
      # Blocking at the edge is therefore the only position that keeps both properties.
      #
      # NOTE: tsbridge (below) routes straight to the container and bypasses Traefik, so
      # JSON stays reachable over the tailnet. That is intended -- the tailnet is identity-
      # gated; the open internet is not.
      - "traefik.http.routers.searxng-nojson-rtr.entrypoints=websecure"
      - "traefik.http.routers.searxng-nojson-rtr.rule=Host(`search.deercrest.info`) && Query(`format`,`json`)"
      # Traefik's default priority is rule length, which this would already win. Set
      # explicitly so a later edit to either rule cannot silently invert the order.
      - "traefik.http.routers.searxng-nojson-rtr.priority=100"
      - "traefik.http.routers.searxng-nojson-rtr.tls=true"
      - "traefik.http.routers.searxng-nojson-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.routers.searxng-nojson-rtr.service=searxng-svc"
      - "traefik.http.routers.searxng-nojson-rtr.middlewares=searxng-denyjson"
      # Second half of the block, and it is NOT redundant. Traefik can match a query
      # string but cannot read a request body, so with SearXNG's upstream default of
      # method:POST the `format=json` parameter arrives in the body where the rule above
      # cannot see it -- measured returning HTTP 200 on 2026-09-25, a complete bypass.
      # settings.yml now sets server.method GET so the form's parameters are in the URL,
      # and this rule denies external POST to /search so the body route is closed too.
      # Scoped to /search on purpose: /autocompleter legitimately takes POST.
      # Both halves are required; removing either one reopens the hole.
      - "traefik.http.routers.searxng-nopost-rtr.entrypoints=websecure"
      - "traefik.http.routers.searxng-nopost-rtr.rule=Host(`search.deercrest.info`) && Method(`POST`) && Path(`/search`)"
      - "traefik.http.routers.searxng-nopost-rtr.priority=110"
      - "traefik.http.routers.searxng-nopost-rtr.tls=true"
      - "traefik.http.routers.searxng-nopost-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.routers.searxng-nopost-rtr.service=searxng-svc"
      - "traefik.http.routers.searxng-nopost-rtr.middlewares=searxng-denyjson"
      # ipallowlist scoped to TEST-NET-1 (RFC 5737, never routed on the internet) matches
      # no real client, so Traefik answers 403 for all of them. This is a deny-all, not an
      # allowlist with a gap -- 192.0.2.1 cannot be a source address here.
      - "traefik.http.middlewares.searxng-denyjson.ipallowlist.sourcerange=192.0.2.1/32"
      # ---------------------------------------------------------------------------------

      - "tsbridge.enabled=true"
      - "tsbridge.service.name=search"                  # Default: container name
      - "tsbridge.service.port=8080"                    # Port inside the container
      - "tsbridge.service.access_log=false"             # Disable access log
      - "tsbridge.service.tags=tag:dev,tag:prod"        # Override default tags
      - "tsbridge.service.whois_enabled=true"           # Add identity headers

    healthcheck:
      interval: 30s
      retries: 5
      start_period: 10s
      test: wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        # Was 1m/1. Engine CAPTCHA and 429 errors are the primary diagnostic signal for
        # this container, and at 1m/1 less than 24h survived -- the 2026-09-24 diagnosis
        # found the window already rotated away and had to reason from a partial log.
        # 10m x 3 keeps a few days without being a meaningful cost on fast.
        max-size: "10m"
        max-file: "3"

  # Apache Tika document parsing server
  # Web interface at: http://localhost:9998 (if port exposed)
  # Extracts text and metadata from various document formats
  ai-tika:
    container_name: ai-tika
    # measured 372 MB 2026-09-06; cap bounds a runaway, not steady state
    mem_limit: 1g
    # renovate: datasource=docker depName=apache/tika
    image: apache/tika:3.3.1.0-full
    pull_policy: always
    restart: unless-stopped
    networks:
      - openwebui
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 5s
      test: wget -qO- http://127.0.0.1:9998/tika > /dev/null || exit 1
      timeout: 5s

  # OpenWebUI - Main AI chat interface
  # Public web interface: https://chat.deercrest.info
  # Primary web UI for interacting with AI models, RAG, and tools
  # Features: Chat, document upload, web search, voice synthesis
  openwebui:
    container_name: ai-openwebui
    # measured 609 MB 2026-09-06; cap bounds a runaway, not steady state
    mem_limit: 1536m
    # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
    image: ghcr.io/open-webui/open-webui:v0.11.4
    pull_policy: always
    restart: unless-stopped
    
    depends_on:
#      - auth
      - ai-docling
      - ai-postgress
      - ai-redis
      - ai-edgetts
      - ai-openwebui-mcp
#      - nginx
      - ai-ollama
      - ai-searxng
      - ai-tika
    networks:
      - t3_proxy
      - openwebui
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui-rtr.entrypoints=websecure"
      - "traefik.http.routers.openwebui-rtr.rule=Host(`chat.deercrest.info`)"
      - "traefik.http.routers.openwebui-rtr.tls=true"
      - "traefik.http.routers.openwebui-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.openwebui-svc.loadbalancer.server.port=8080"

      - "tsbridge.enabled=true"
      - "tsbridge.service.name=chat"                    # Default: container name
      - "tsbridge.service.port=8080"                    # Port inside the container
      - "tsbridge.service.access_log=false"             # Disable access log
      - "tsbridge.service.tags=tag:dev,tag:prod"        # Override default tags
      - "tsbridge.service.whois_enabled=true"           # Add identity headers
    environment:
      - ANONYMIZED_TELEMETRY=false
      # Edge TTS configuration
      - AUDIO_TTS_API_KEY=your_api_key_here
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_MODEL=tts-1-hd
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://ai-edgetts:5050/v1
      - AUDIO_TTS_OPENAI_API_KEY=your_api_key_here
      - AUDIO_TTS_VOICE=en-US-EmmaMultilingualNeural
      # Extraction and Embedding configuration
      - CONTENT_EXTRACTION_ENGINE=tika
      - DATABASE_URL=postgresql://owui-user:171d29d40f07946b@ai-postgress/owui
      # 
      - DOCLING_SERVER_URL=http://ai-docling:5001
      - ENABLE_EVALUATION_ARENA_MODELS=false
      - ENABLE_IMAGE_GENERATION=false
      - ENABLE_OLLAMA_API=true
      - ENABLE_OPENAI_API=false
      - ENABLE_RAG_WEB_SEARCH=true
      - ENABLE_WEB_SEARCH=true
      - ENABLE_WEBSOCKET_SUPPORT=true
      - ENV=dev
      - GLOBAL_LOG_LEVEL=info
      - OLLAMA_BASE_URLS=http://ai-ollama:11434
      - PDF_EXTRACT_IMAGES=true
      - PGVECTOR_DB_URL=postgresql://owui-user:171d29d40f07946b@ai-postgress/owui
      - RAG_EMBEDDING_ENGINE=ollama
      # Was RAG_ENBEDDING_MODEL (N, not M) -- a typo, so this was silently ignored and the
      # image default sentence-transformers/all-MiniLM-L6-v2 was being sent to OLLAMA,
      # which has never had that model. Result: RAG embedding failed regardless of search.
      # Requires `ollama pull nomic-embed-text` on the host; it is not bundled.
      - RAG_EMBEDDING_MODEL=nomic-embed-text:latest
      - RAG_OLLAMA_BASE_URL=http://ai-ollama:11434
      - RAG_TEXT_SPLITTER=token
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      - RAG_WEB_SEARCH_ENGINE=searxng
      - RAG_WEB_SEARCH_RESULT_COUNT=6
      - REDIS_KEY_PREFIX=open-webui
      - REDIS_URL=redis://ai-redis:6379/2
      # Internal, not https://search.deercrest.info -- that hairpinned every RAG search out
      # through Cloudflare and Traefik and back into the same LXC. Going direct also lets
      # the edge block external format=json (see the searxng traefik labels) without
      # breaking Open WebUI.
      - SEARXNG_QUERY_URL=http://ai-searxng:8080/search?q=<query>
      - TIKA_SERVER_URL=http://ai-tika:9998
      - TOOL_SERVER_CONNECTIONS=[{"url":"http://ai-openwebui-mcp:8000/time","path":"openapi.json","auth_type":"none","key":"","config":{"enable":true,"access_control":null},"info":{"name":"time","description":""}},{"url":"http://ai-openwebui-mcp:8000/postgress","path":"openapi.json","auth_type":"none","key":"","config":{"enable":true,"access_control":null},"info":{"name":"postgres","description":""}}]
      - USE_CUDA_DOCKER=false
      - VECTOR_DB=pgvector
      - WEB_SEARCH_ENGINE=searxng
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=http://deercrest.info
      - WEBSOCKET_MANAGER=redis
      - WEBSOCKET_REDIS_URL=redis://ai-redis:6379/3
      - WHISPER_MODEL_AUTO_UPDATE=false

    volumes:
      - /mnt/fast/appdata/llm-ai/open-webui:/app/backend/data
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 10s
      test: curl --fail http://localhost:8080/health || exit 1
      timeout: 5s


  # ai-pipelines:
  #   image: ghcr.io/open-webui/pipelines:main
  #   container_name: ai-pipelines
