# Selfhost Monitoring Stack
# Prometheus + Grafana + node-exporter
# Provides unified observability for all selfhost containers, Home Assistant, and Cerebro VM
#
# cAdvisor was REMOVED on 2026-08-17. It grew ~30MB/s to its 1g cap and was
# OOM-killed roughly every 31 seconds (21,598 restarts by the end), accounting
# for 31 of the 42 OOM kills in the kernel ring buffer. The knobs that normally
# contain it were already set (--docker_only, --housekeeping_interval=30s and a
# wide --disable_metrics) and did not help. Do not re-add it without first
# reproducing the leak on a pinned older tag -- it was fine until the Renovate
# bump to v0.55.1 on 2026-03-07 (#151).
#
# Cost of removal: the per-container Grafana dashboard (11600) has no data
# source. Host metrics (node-exporter) and *arr metrics (exportarr) are
# unaffected, and nothing functional ever depended on cAdvisor.

include:
  - prometheus.yaml
  - grafana.yaml
  - node-exporter.yaml

# All services connect to the t3_proxy network (Traefik)
# Access URLs:
#   - Grafana: https://grafana.deercrest.info (dashboards and visualization)
#   - Prometheus: https://prometheus.deercrest.info (requires Authelia auth)
#   - node-exporter: Internal only (no web UI)

# Default credentials:
#   Grafana: admin / admin (change on first login)

# Scrape targets configured in prometheus/prometheus.yml:
#   - 7 exportarr instances (prowlarr, radarr, sonarr, lidarr, readarr, bazarr, sabnzbd)
#   - Traefik metrics
#   - node-exporter (host system metrics)
#   - Future: Home Assistant (add to prometheus.yml when ready)
#   - Future: Cerebro VM node-exporter (add to prometheus.yml when deployed)

# Recommended Grafana Dashboards to Import:
#   - Traefik Dashboard: https://grafana.com/grafana/dashboards/17347
#   - Exportarr Media Stack: https://grafana.com/grafana/dashboards/15709
#   - Node Exporter Full: https://grafana.com/grafana/dashboards/1860
#   (cAdvisor Docker / 11600 no longer has a data source -- see removal note above)

# Resource Usage (measured 2026-08-17, not estimated):
#   - Prometheus: ~200MB RAM steady state at 43,937 active series, 4.7GB disk
#                 (30 day retention). It briefly held 1.8GB while cAdvisor was
#                 crash-looping -- that was churn, not working set.
#   - Grafana: 100-200MB RAM, 500MB disk
#   - node-exporter: 10-20MB RAM, minimal disk
#   - Total: ~350MB RAM, ~5GB disk
