# Grafana provisioned alert rules for the image-drift instrument (group `image-drift`) and the
# deploy agent, scripts/deploy-stacks.sh (group `deploy`).
#
# ⚠️ `noDataState: Alerting` ON ALL THREE `image-drift` RULES IS THE FAIL-CLOSED LEVER, IN GRAFANA'S
#    VOCABULARY. (The `deploy` group gives it to its stale rule only — see that group's comment.)
#    It is not a style choice and it must not be relaxed to OK or NoData "to reduce noise".
#
#    Grafana's DEFAULT for a rule with no data is NoData, which does not notify. So without this
#    line, a metric that is ABSENT — the timer never installed, node-exporter never given the
#    textfile flag, the .prom file never written, the collector directory never created — produces
#    SILENCE, and silence is indistinguishable from a healthy estate. That is the precise failure
#    this whole instrument exists to make impossible: quick-health-check.sh's KNOWN LIMIT notice
#    records that the estate's previous coverage gap was not "we had no detector" but "nobody
#    looked", and an alert rule that cannot fire when its input vanishes reopens it.
#
#    `execErrState: Alerting` is the same argument for a query that errors rather than one that
#    returns nothing.
#
# THE DATASOURCE UID IS A LITERAL, AND IT WAS READ FROM THE LIVE INSTANCE, NOT INVENTED:
#    `GET /api/datasources` on the running Grafana on 2026-09-18 returned
#    {"uid":"PBFA97CFB590B2093","name":"Prometheus"}. Provisioned alert rules can only reference a
#    datasource by uid, and ../datasources.yml declares no `uid:` field, so Grafana generated one.
#    ADDING `uid:` TO datasources.yml WAS CONSIDERED AND DECLINED: provisioning matches an existing
#    datasource by name and would REWRITE its uid, silently breaking every hand-imported dashboard
#    that references the old one. Pinning the literal here changes nothing that is already running.
#    If the datasource is ever recreated from scratch, re-read the uid and update this file.
#
# ⚠️ THE 7200s IN RULE 3 IS HALF OF A DECISION WHOSE OTHER HALF LIVES IN
#    scripts/systemd/selfhost-image-drift.timer. Hourly + RandomizedDelaySec=10m means two healthy
#    runs land at most 70 minutes apart; 7200s adds one whole missed run of slack. Change the timer
#    period and you MUST change this number in the same commit, and vice versa. Both files say so.
#
# ⚠️ THE 7500s IN THE `deploy` GROUP'S STALE RULE IS LIKEWISE ONE DECISION ACROSS THREE FILES:
#    scripts/systemd/selfhost-deploy.timer (OnCalendar=*:0/30 + RandomizedDelaySec=5m = 35 min worst
#    gap), scripts/systemd/selfhost-deploy.service (TimeoutStartSec=60min runtime cap) and
#    scripts/deploy-stacks.sh (RUN_BUDGET_SECONDS + per-stack timeouts, which keep a run inside that
#    cap). 35 + 60 + one whole missed run of 30 = 125 min = 7500 s. Change any term and you MUST
#    change 7500 in the same commit. The timer says so too.

apiVersion: 1

groups:
  - orgId: 1
    name: image-drift
    folder: Estate
    interval: 5m
    rules:

      # -----------------------------------------------------------------------------------------
      # 1. Image drift — the repo's pins moved and the host did not.
      # -----------------------------------------------------------------------------------------
      - uid: selfhost-image-drift-containers
        title: Image drift
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          area: estate
        annotations:
          summary: >-
            {{ $values.A.Value }} container(s) are running an image tag this repository no longer
            pins.
          description: >-
            Run: ssh root@172.16.1.159 'bash /mnt/fast/stacks/scripts/check-drift.sh'
            for the per-container list (running tag -> declared tag).

            Nothing deploys itself unless selfhost-deploy.timer runs with the apply drop-in
            (scripts/systemd/selfhost-deploy-apply.conf), and held services are only ever cleared
            by a human — see monitoring/README.md § Deploy agent.
            Why it exists, and the floating-tag limit: monitoring/README.md § Image drift detection.
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              expr: max(selfhost_image_drift_containers)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []

      # -----------------------------------------------------------------------------------------
      # 2. Containers unhealthy or stuck in `created`.
      # -----------------------------------------------------------------------------------------
      - uid: selfhost-containers-unhealthy-or-created
        title: Containers unhealthy or stuck created
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          area: estate
        annotations:
          summary: >-
            {{ $values.A.Value }} container(s) are unhealthy or stuck in state `created`.
          description: >-
            Run: ssh root@172.16.1.159 'docker ps -a'  (NOT `docker ps` — it hides `created`,
            and it reported cadvisor "Up 2 weeks" while inspect showed it exited 16 days earlier).
            Then: docker inspect <name> --format '{{ .State.Status }} {{ .State.ExitCode }}'

            Believe inspect over ps. Background: monitoring/README.md § Image drift detection.
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              # Deliberately NOT wrapped in `or vector(0)`. If either series is absent the sum is
              # empty, the rule goes NoData, and noDataState: Alerting fires. Defaulting the
              # missing side to 0 would turn "the writer never ran" into a confident green — the
              # exact conflation this file exists to refuse. Both series are written by the same
              # atomic write, so partial absence means the write did not happen.
              expr: max(selfhost_containers_unhealthy) + max(selfhost_containers_created)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []

      # -----------------------------------------------------------------------------------------
      # 3. Drift check is stale — THE RULE THAT WATCHES THE WATCHER.
      # -----------------------------------------------------------------------------------------
      - uid: selfhost-image-drift-stale
        title: Drift check is stale
        condition: C
        # No `for:` on purpose. The 7200s threshold IS the debounce — two hours of staleness is
        # already past every legitimate gap, and adding a pending period on top would only delay a
        # signal that is, by construction, never transient.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          area: estate
        annotations:
          summary: >-
            Drift check has not succeeded for {{ $values.A.Value }}s — the other two rules are
            now stale and their silence is meaningless.
          description: >-
            The timer has stopped producing successful runs, so the other two rules are frozen at
            their last values — their silence now means nothing.

            Run: ssh root@172.16.1.159 'systemctl list-timers selfhost-image-drift.timer;
            journalctl -u selfhost-image-drift.service -n 50'
            A stale .prom after a failed run is CORRECT — the script never writes a fresh timestamp
            on a dead run. Background: monitoring/README.md § Image drift detection.

            If this alert fires and the timer was never installed at all, that is gated host step
            G3 in stacks/selfhosted/monitoring/README.md, and it is expected until someone runs it.
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              expr: time() - max(selfhost_image_drift_last_success_timestamp_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      # 7200s. SEE THE WARNING AT THE TOP OF THIS FILE — this number and
                      # OnCalendar/RandomizedDelaySec in selfhost-image-drift.timer are ONE
                      # decision. Do not tune either alone.
                      - 7200
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []

  # ===============================================================================================
  # deploy — scripts/deploy-stacks.sh (quick 261022-025). Runbook: monitoring/README.md § Deploy agent.
  #
  # noDataState (D-H): the STALE rule carries `Alerting` — it owns "deploy.prom is absent or frozen".
  # The FAILED and REFUSED rules carry `OK` on purpose: an absent deploy.prom is ONE condition, and
  # three pages for one cause trains the reader to ignore all three. That relaxation is safe only
  # because every series those two rules read is written by the same atomic write as the stale
  # rule's timestamp (verified against a real dry-run file when this group was added).
  # ===============================================================================================
  - orgId: 1
    name: deploy
    folder: Estate
    interval: 5m
    rules:

      # -----------------------------------------------------------------------------------------
      # 1. Deploy failed — a stack failed, or the disk guard stopped the run.
      # -----------------------------------------------------------------------------------------
      - uid: selfhost-deploy-failed
        title: Deploy failed
        condition: C
        # No `for:` — each run is a discrete event, and the next run overwrites the gauges.
        # noDataState OK: the stale rule owns an absent deploy.prom (D-H, group comment above).
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          area: estate
        annotations:
          summary: >-
            The last deploy run had {{ $values.A.Value }} failure(s) (failed stacks + disk guard).
          description: >-
            Run: ssh root@172.16.1.159 'journalctl -u selfhost-deploy.service -n 200'
            A disk-guard trip STOPS the run before later stacks — they stay pending until free
            space on / (and DockerRootDir) is back above the 20 GiB D-17 floor + 10 GiB headroom.
            Runbook: monitoring/README.md § Deploy agent.
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              expr: max(selfhost_deploy_failed_stacks) + max(selfhost_deploy_disk_guard_tripped)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []

      # -----------------------------------------------------------------------------------------
      # 2. Deploy refused — the checkout is dirty or not fast-forwardable.
      # -----------------------------------------------------------------------------------------
      - uid: selfhost-deploy-refused
        title: Deploy refused (checkout not clean or not fast-forward)
        condition: C
        # noDataState OK: the stale rule owns an absent deploy.prom (D-H, group comment above).
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          area: estate
        annotations:
          summary: >-
            The deploy agent REFUSED to run: /mnt/fast/stacks is dirty or has diverged from
            origin/main. Nothing deploys until a human resolves it.
          description: >-
            Run: ssh root@172.16.1.159 'git -C /mnt/fast/stacks status --short'
            THE FIX IS TO COMMIT THE HOST EDIT OR DELIBERATELY DISCARD IT. THE AGENT NEVER STASHES
            OR RESETS, BECAUSE THE HOST HAS CARRIED PRODUCTION-ONLY EDITS BEFORE.
            Runbook: monitoring/README.md § Deploy agent.
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              expr: max(selfhost_deploy_refused)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []

      # -----------------------------------------------------------------------------------------
      # 3. Deploy agent is stale — THE RULE THAT WATCHES THE DEPLOY TIMER.
      # -----------------------------------------------------------------------------------------
      - uid: selfhost-deploy-stale
        title: Deploy agent is stale
        condition: C
        # No `for:` — the 7500s threshold IS the debounce.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          area: estate
        annotations:
          summary: >-
            The deploy agent has not completed a run for {{ $values.A.Value }}s — the failed and
            refused rules are now reading a frozen file.
          description: >-
            Run: ssh root@172.16.1.159 'systemctl list-timers selfhost-deploy.timer;
            journalctl -u selfhost-deploy.service -n 100'
            A stale deploy.prom after a could-not-look run is CORRECT: the script leaves the file
            untouched so this rule fires.

            This rule fires from the next Grafana restart until the timer is installed (gated host
            step D1 in monitoring/README.md § Deploy agent), exactly as the drift stale rule does
            for G3 — so install the timer BEFORE recreating Grafana.
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              expr: time() - max(selfhost_deploy_last_run_timestamp_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      # 7500s = 35 min (timer period + jitter) + 60 min (service TimeoutStartSec)
                      # + 30 min (one whole missed run). ONE decision with selfhost-deploy.timer,
                      # selfhost-deploy.service and deploy-stacks.sh's run budget — see the
                      # warning at the top of this file. Do not tune any term alone.
                      - 7500
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
