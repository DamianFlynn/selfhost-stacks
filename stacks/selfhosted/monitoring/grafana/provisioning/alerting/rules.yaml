# Grafana provisioned alert rules for the image-drift instrument.
#
# ⚠️ `noDataState: Alerting` ON ALL THREE RULES IS THE FAIL-CLOSED LEVER, IN GRAFANA'S VOCABULARY.
#    It is not a style choice and it must not be relaxed to OK or NoData "to reduce noise".
#
#    Grafana's DEFAULT for a rule with no data is NoData, which does not notify. So without this
#    line, a metric that is ABSENT — the timer never installed, node-exporter never given the
#    textfile flag, the .prom file never written, the collector directory never created — produces
#    SILENCE, and silence is indistinguishable from a healthy estate. That is the precise failure
#    this whole instrument exists to make impossible: quick-health-check.sh's KNOWN LIMIT notice
#    records that the estate's previous coverage gap was not "we had no detector" but "nobody
#    looked", and an alert rule that cannot fire when its input vanishes reopens it.
#
#    `execErrState: Alerting` is the same argument for a query that errors rather than one that
#    returns nothing.
#
# THE DATASOURCE UID IS A LITERAL, AND IT WAS READ FROM THE LIVE INSTANCE, NOT INVENTED:
#    `GET /api/datasources` on the running Grafana on 2026-09-18 returned
#    {"uid":"PBFA97CFB590B2093","name":"Prometheus"}. Provisioned alert rules can only reference a
#    datasource by uid, and ../datasources.yml declares no `uid:` field, so Grafana generated one.
#    ADDING `uid:` TO datasources.yml WAS CONSIDERED AND DECLINED: provisioning matches an existing
#    datasource by name and would REWRITE its uid, silently breaking every hand-imported dashboard
#    that references the old one. Pinning the literal here changes nothing that is already running.
#    If the datasource is ever recreated from scratch, re-read the uid and update this file.
#
# ⚠️ THE 7200s IN RULE 3 IS HALF OF A DECISION WHOSE OTHER HALF LIVES IN
#    scripts/systemd/selfhost-image-drift.timer. Hourly + RandomizedDelaySec=10m means two healthy
#    runs land at most 70 minutes apart; 7200s adds one whole missed run of slack. Change the timer
#    period and you MUST change this number in the same commit, and vice versa. Both files say so.

apiVersion: 1

groups:
  - orgId: 1
    name: image-drift
    folder: Estate
    interval: 5m
    rules:

      # -----------------------------------------------------------------------------------------
      # 1. Image drift — the repo's pins moved and the host did not.
      # -----------------------------------------------------------------------------------------
      - uid: selfhost-image-drift-containers
        title: Image drift
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          area: estate
        annotations:
          summary: >-
            {{ $values.A.Value }} container(s) are running an image tag this repository no longer
            pins.
          description: >-
            Run: ssh root@172.16.1.159 'bash /mnt/fast/stacks/scripts/check-drift.sh'
            for the per-container list (running tag -> declared tag).

            Alert-only: nothing deploys itself, so only a human clears this.
            Why it exists, and the floating-tag limit: monitoring/README.md § Image drift detection.
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              expr: max(selfhost_image_drift_containers)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []

      # -----------------------------------------------------------------------------------------
      # 2. Containers unhealthy or stuck in `created`.
      # -----------------------------------------------------------------------------------------
      - uid: selfhost-containers-unhealthy-or-created
        title: Containers unhealthy or stuck created
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          area: estate
        annotations:
          summary: >-
            {{ $values.A.Value }} container(s) are unhealthy or stuck in state `created`.
          description: >-
            Run: ssh root@172.16.1.159 'docker ps -a'  (NOT `docker ps` — it hides `created`,
            and it reported cadvisor "Up 2 weeks" while inspect showed it exited 16 days earlier).
            Then: docker inspect <name> --format '{{ .State.Status }} {{ .State.ExitCode }}'

            Believe inspect over ps. Background: monitoring/README.md § Image drift detection.
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              # Deliberately NOT wrapped in `or vector(0)`. If either series is absent the sum is
              # empty, the rule goes NoData, and noDataState: Alerting fires. Defaulting the
              # missing side to 0 would turn "the writer never ran" into a confident green — the
              # exact conflation this file exists to refuse. Both series are written by the same
              # atomic write, so partial absence means the write did not happen.
              expr: max(selfhost_containers_unhealthy) + max(selfhost_containers_created)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []

      # -----------------------------------------------------------------------------------------
      # 3. Drift check is stale — THE RULE THAT WATCHES THE WATCHER.
      # -----------------------------------------------------------------------------------------
      - uid: selfhost-image-drift-stale
        title: Drift check is stale
        condition: C
        # No `for:` on purpose. The 7200s threshold IS the debounce — two hours of staleness is
        # already past every legitimate gap, and adding a pending period on top would only delay a
        # signal that is, by construction, never transient.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          area: estate
        annotations:
          summary: >-
            Drift check has not succeeded for {{ $values.A.Value }}s — the other two rules are
            now stale and their silence is meaningless.
          description: >-
            The timer has stopped producing successful runs, so the other two rules are frozen at
            their last values — their silence now means nothing.

            Run: ssh root@172.16.1.159 'systemctl list-timers selfhost-image-drift.timer;
            journalctl -u selfhost-image-drift.service -n 50'
            A stale .prom after a failed run is CORRECT — the script never writes a fresh timestamp
            on a dead run. Background: monitoring/README.md § Image drift detection.

            If this alert fires and the timer was never installed at all, that is gated host step
            G3 in stacks/selfhosted/monitoring/README.md, and it is expected until someone runs it.
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              expr: time() - max(selfhost_image_drift_last_success_timestamp_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      # 7200s. SEE THE WARNING AT THE TOP OF THIS FILE — this number and
                      # OnCalendar/RandomizedDelaySec in selfhost-image-drift.timer are ONE
                      # decision. Do not tune either alone.
                      - 7200
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
