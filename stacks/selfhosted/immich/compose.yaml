  #     - "traefik.http.routers.immichtools-rtr.rule=Host(`photomagic.deercrest.info`)"
  #     - "traefik.http.routers.immichtools-rtr.tls=true"
  #     - "traefik.http.routers.immichtools-rtr.tls.certresolver=dns-cloudflare"
