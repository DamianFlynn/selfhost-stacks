# Immich Stack - Photo and video management platform
# Self-hosted Google Photos alternative with machine learning

name: immich

########################### NETWORKS
networks:
  t3_proxy:
    external: true
  immich:
    name: immich
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.80.0/24

services:
  immich-server:
    container_name: immich_server
    # RAISED 3g -> 6g on 2026-09-20 after 28 restarts in ~24h.
    #
    # The 1720 MB measurement below was taken at ~85k assets. The library is now
    # ~127k assets after the Google Takeout import (+100 GB), and the container
    # was peaking at 2.7G against a 3.0G cap -- 90% -- within minutes of starting.
    #
    # THE FAILURE MODE IS EASY TO MISDIAGNOSE: when the cgroup OOM-kills a WORKER
    # inside the container, PID 1 exits cleanly, so `docker inspect` reports
    # ExitCode=0 and **OOMKilled=false** and the logs show no shutdown at all.
    # It looks like a clean restart. Check the cgroup instead:
    #   memory.peak vs memory.max, and memory.events `oom_kill`
    # (those counters reset on every restart, so read them while it is up).
    #
    # Each restart truncated in-flight uploads, which surfaced to the phone as
    # upload errors and to the server as "VipsJpeg: premature end of JPEG image".
    #
    # 6g is a CEILING, not an allocation. Estate memory is not abundant (LXC 100
    # had ~7G available of 24 when this was set), so if this needs raising again,
    # check free memory on BOTH the LXC and atlantis first -- this estate has a
    # documented outage caused by host memory exhaustion.
    # measured 1720 MB 2026-09-06; cap bounds a runaway, not steady state.
    mem_limit: 6g
    # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
    image: ghcr.io/immich-app/immich-server:v3.2.2
    pull_policy: always
    env_file:
      - /mnt/fast/stacks/stacks/selfhosted/immich/.env
    environment:
      - TZ=${TZ}
      # Advise the server to use VAAPI when available
      - IMMICH_FFMPEG_HWACCEL=vaapi
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      # Optional read-only import staging (uncomment .env IMPORT_PATH and line below)
      # - ${IMPORT_PATH}:/import:ro
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    group_add:
      - "44"
      - "110"
    devices:
      - /dev/dri:/dev/dri
    networks:
      - t3_proxy
      - immich
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich-rtr.entrypoints=websecure"
      - "traefik.http.routers.immich-rtr.rule=Host(`photos.${DOMAINNAME}`)"
      - "traefik.http.routers.immich-rtr.tls=true"
      - "traefik.http.routers.immich-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.routers.immich-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.immich-rtr.service=immich-svc"
      - "traefik.http.services.immich-svc.loadbalancer.server.port=2283"

      - "tsbridge.enabled=true"
      - "tsbridge.service.name=photos"                 # Default: container name
      - "tsbridge.service.port=2283"                   # Port inside the container
      - "tsbridge.service.access_log=false"            # Disable access log
      - "tsbridge.service.tags=tag:dev,tag:prod"       # Override default tags
      - "tsbridge.service.whois_enabled=true"          # Add identity headers
      
  immich-machine-learning:
    container_name: immich_machine_learning
    # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
    pull_policy: always
    env_file:
      - /mnt/fast/stacks/stacks/selfhosted/immich/.env
    environment:
      # ⚠️ CPU-ONLY IS GUARANTEED BY THE IMAGE TAG, NOT BY THESE VARIABLES.
      # Measured 2026-09-18: NO Immich ML code reads EXECUTION_PROVIDERS or
      # IMMICH_ML_FORCE_CPU at any version -- providers come solely from
      # ort.get_available_providers(), and this container offers only
      # ['AzureExecutionProvider', 'CPUExecutionProvider'] because the tag has
      # no -rocm/-cuda suffix. These four lines are INERT.
      #
      # THE HAZARD: switching this tag to :v3.2.2-rocm believing these vars
      # will hold it to CPU would start ROCm inference on the amdgpu that took
      # the estate down for ~6h on 2026-08-31. If GPU ML is ever wanted, that
      # is a deliberate decision about amdgpu stability -- not a tag edit.
      # Kept (not deleted) only because they are harmless and their absence
      # would read as "nobody considered this".
      EXECUTION_PROVIDERS: CPUExecutionProvider
      IMMICH_ML_FORCE_CPU: true        # inert -- see above
      ROCR_VISIBLE_DEVICES:            # inert -- see above
      HIP_VISIBLE_DEVICES:             # inert -- see above
    volumes:
      - model-cache:/cache
    restart: always
    healthcheck:
      disable: false
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    ipc: host
    networks:
      - immich

  redis:
    container_name: immich_redis
    # renovate: datasource=docker depName=docker.io/valkey/valkey
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    pull_policy: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    restart: always
    networks:
      - immich

  database:
    container_name: immich_postgres
    # renovate: datasource=docker depName=ghcr.io/immich-app/postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:41eacbe83eca995561fe43814fd4891e16e39632806253848efaf04d3c8a8b84
    pull_policy: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    networks:
      - immich

  # Immich Kiosk - Display mode for photo slideshows
  immich-kiosk:
    # renovate: datasource=docker depName=ghcr.io/damongolding/immich-kiosk
    image: ghcr.io/damongolding/immich-kiosk:0.44.1
    container_name: immich_kiosk
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - t3_proxy
      - immich
    environment:
      # Immich connection (v0.14+ uses KIOSK_ prefix for all env vars)
      - KIOSK_IMMICH_URL=${IMMICH_KIOSK_URL:-http://immich_server:2283}
      - KIOSK_IMMICH_API_KEY=${IMMICH_KIOSK_API_KEY}
      
      # Kiosk settings
      - KIOSK_SHOW_TIME=${KIOSK_SHOW_TIME:-true}
      - KIOSK_SHOW_DATE=${KIOSK_SHOW_DATE:-true}
      - KIOSK_SHOW_LOCATION=${KIOSK_SHOW_LOCATION:-false}
      - KIOSK_TRANSITION_DURATION=${KIOSK_TRANSITION_DURATION:-5000}
      - KIOSK_IMAGE_FIT=${KIOSK_IMAGE_FIT:-contain}
      
      # Filters
      - KIOSK_ALBUM_ID=${KIOSK_ALBUM_ID:-}
      - KIOSK_PERSON_ID=${KIOSK_PERSON_ID:-}
      
      # Display
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=t3_proxy"

      # ─────────────────────────────────────────────────────────────────────────────────────
      # INTERNAL + TAILNET ONLY. THIS ROUTER MUST NEVER BE PUBLICLY REACHABLE.
      #
      # The label block here previously said "HTTP Router (public or protected based on use
      # case)" and carried NO auth middleware, so the use case it actually implemented was
      # PUBLIC. That was latent rather than live only because kiosk.deercrest.info had no DNS
      # record. On 2026-09-26 a CNAME was created for it during a DNS/rule reconciliation and
      # the consequence was immediate and measured: `GET https://kiosk.deercrest.info/` served
      # 200 unauthenticated and `/image` returned a real JPEG (verified by magic number
      # ff d8 ff) — the family photo library, readable by anyone on the internet, with no
      # login. The record was deleted within minutes and the name is NXDOMAIN again.
      #
      # Operator decision, same day: "that should be an internal and maybe also tailscale only".
      #
      # So the exposure is now closed at TWO layers, deliberately, because DNS absence is not a
      # security control — it is one API call away from being reversed by anyone tidying a zone:
      #
      #   1. NO DNS RECORD. Deliberately absent. Do not create one.
      #   2. ipallowlist, below. Even WITH a record, only the LAN and the tailnet are admitted.
      #      Traefik matches on the immediate peer address, and a request arriving through the
      #      Cloudflare proxy presents a Cloudflare edge IP, so this denies the public path by
      #      construction rather than by configuration of the edge. Kiosk displays live on the
      #      LAN; nothing off-tailnet has a legitimate reason to reach this.
      #
      # Kiosk is also the one service where auth cannot be the answer: a wall-mounted display
      # cannot complete an Authelia login, which is exactly why it was left open in the first
      # place. Network scope is the correct control here, not SSO.
      - "traefik.http.routers.immich-kiosk.entrypoints=web,websecure"
      - "traefik.http.routers.immich-kiosk.rule=Host(`kiosk.deercrest.info`)"
      - "traefik.http.routers.immich-kiosk.service=immich-kiosk"
      - "traefik.http.routers.immich-kiosk.middlewares=kiosk-internal-only"
      - "traefik.http.middlewares.kiosk-internal-only.ipallowlist.sourcerange=172.16.1.0/24,100.64.0.0/10,127.0.0.1/32"
      - "traefik.http.services.immich-kiosk.loadbalancer.server.port=3000"

      # ── Tailnet exposure via tsbridge ────────────────────────────────────────────────────
      # The sanctioned way to reach this from off-LAN. tsbridge runs tsnet in USERSPACE, so it
      # needs no /dev/net/tun and grants no network privilege. It already serves nine services
      # this way (chat, search, ollama, docling, photos, …) from containers on t3_proxy, which
      # is the network this container is on, so no network change is required.
      - "tsbridge.enabled=true"
      - "tsbridge.service.name=kiosk"
      - "tsbridge.service.port=3000"
      - "tsbridge.service.tags=tag:server"
      - "tsbridge.service.access_log=false"
    depends_on:
      - immich-server

  # power-tools:
  #   container_name: immich_power_tools
  #   image: ghcr.io/varun-raj/immich-power-tools:latest
  #   pull_policy: always
