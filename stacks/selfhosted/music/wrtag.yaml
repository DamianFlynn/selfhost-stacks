# wrtag - Music Tagging and Organization Tool
#
# Purpose:
#   Automatically tags and organizes music files using online databases
#   Designed for DJ collections (Mastermix, CD Pool, DMC, Music Factory)
#
# Key Features:
#   - Web-based interface for batch music processing
#   - Automatic metadata lookup from MusicBrainz, Discogs, and other sources
#   - Embedded cover art from multiple sources
#   - Customizable file and folder naming patterns
#   - Support for various audio formats (MP3, FLAC, AAC, etc.)
#   - Research links for manual verification
#
# Workflow:
#   Upload/scan music → Match metadata → Review/edit → Apply tags → Organize files
#   Status (2026-08-18): FROZEN. Library mount deleted and gated behind restart "no" +
#   profiles ["manual"] so it never runs unattended (WRIT-02, D-22). Retained only so
#   Phase 3 can run its `wrtag move -dry-run` disqualifier test against a scratch target.
#   Phase 4 owns retirement — see .planning/ROADMAP.md.
#
# Access:
#   URL: https://wrtag.deercrest.info
#   Middleware: chain-authelia (protected - admin only)
#

services:
  wrtag:
    # v0.30.0 changed path-format fields — pinned to last compatible version; update path-format before upgrading
    image: sentriz/wrtag:v0.20.0
    container_name: wrtag
    hostname: wrtag
    restart: "no"  # Don't run 24/7, start manually or via cron
    profiles: ["manual"]  # Exclude from 'docker compose up'
    security_opt:
      - no-new-privileges:true
    networks:
      - t3_proxy
    volumes:
      # NOTE (2026-08-18): the destination library mount was DELETED here, not commented
      # out — WRIT-02 requires the mount gone, not just the restart policy changed. wrtag
      # was found actively running and holding a direct read-write mount on the music
      # library; nothing holds read-write on it during Phases 1-3 (D-20) and the winner
      # is granted that in Phase 6.
      #
      # Phase 3 still needs wrtag invokable for its `wrtag move -dry-run` disqualifier
      # test. That run supplies its own throwaway scratch destination on the command line,
      # so the test is measured against a target that cannot be the real library. The
      # source mount below is retained for exactly that run.
      #
      # Do not re-add a mount pointing at the music library here. wrtag is frozen, not
      # retired — Phase 4 owns deleting this definition and is independently shippable.
      #
      # Database and job queue
      - /mnt/fast/appdata/media/wrtag/data:/data:rw
      # Source music (unsorted downloads)
      - /mnt/tank/downloads/complete/nzb/unsorted:/music/source:rw
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # wrtag specific configuration
      - WRTAG_WEB_API_KEY=${WRTAG_API_KEY}
      - WRTAG_WEB_LISTEN_ADDR=:80
      - WRTAG_WEB_PUBLIC_URL=https://wrtag.${DOMAINNAME}
      - WRTAG_WEB_DB_PATH=/data/wrtag.db
      - WRTAG_LOG_LEVEL=info
      # Path format for compilations (DJ mixes, multi-artist albums)
      # Uses: Compilations/Album (Year)/Disc X/Track - Artist - Title
      # Release.Date.Year disambiguates volumes with the same title (e.g. "Now 100" from different years)
      - WRTAG_PATH_FORMAT=/music/library/Compilations/{{ .Release.Title | safepath }} ({{ .Release.Date.Year }})/{{ if gt (len .Release.Media) 1 }}Disc {{ .Media.Position }}/{{ end }}{{ pad0 2 .Track.Position }} - {{ if .IsCompilation }}{{ artistsString .Track.Artists | safepath }} - {{ end }}{{ .Track.Title | safepath }}{{ .Ext }}
      # Research links for manual verification
      - WRTAG_RESEARCH_LINK=https://www.discogs.com/search/?q={query},https://musicbrainz.org/search?query={query}
    labels:
      - traefik.enable=true
      # HTTP Routers
      - traefik.http.routers.wrtag.entrypoints=websecure
      - traefik.http.routers.wrtag.rule=Host(`wrtag.${DOMAINNAME}`)
      - traefik.http.routers.wrtag.tls=true
      - traefik.http.routers.wrtag.tls.certresolver=dns-cloudflare
      # Middlewares
      - traefik.http.routers.wrtag.middlewares=chain-authelia@file
      # HTTP Services
      - traefik.http.routers.wrtag.service=wrtag-svc
      - traefik.http.services.wrtag-svc.loadbalancer.server.port=80
