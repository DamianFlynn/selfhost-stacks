# neocortex-memory - The memory service for the neocortex platform (neocortex v2 Phase 3, TODO-315)
#
# Purpose:
#   Serves database `neocortex_memory` over HTTP so that every client - Pi on the M5, the indexer
#   on the mini, the CLIs - reaches memory through ONE authenticated API instead of each holding a
#   Postgres DSN. Scope filtering, grants and audit happen server-side, where they cannot be
#   bypassed by a client that forgets to pass a flag.
#
# Workflow:
#   Pi / CLIs / indexer -> Traefik (websecure, dns-cloudflare) -> api:8787
#   api -> agentic-os-db:5432 / neocortex_memory   (read-write, its own database)
#   api -> agentic-os-db:5432 / agentic_os         (READ-ONLY, the legacy bridge, TODO-311)
#
#   The bridge is how v1 recall keeps working before Phase 4 moves the content. It is one
#   identity, ranked last, and it never writes: role `memory_legacy_ro` holds SELECT on exactly
#   the tables the search reads and nothing else. See README "The two roles".
#
# Access:
#   URL: https://cortex.deercrest.info   (hostname chosen by Damian 2026-09-22)
#   Middleware: NONE, deliberately - the same reasoning as couchdb.
#     - chain-authelia@file -> forwardAuth bounces API clients to a login page; these are
#                              non-interactive clients holding bearer tokens, not browsers.
#     - chain-no-auth@file  -> its secure-headers middleware caps accessControlAllowMethods,
#                              and this API is POST-heavy (/v1/memory/search, /v1/memory/ingest).
#   The boundary is MEMORY_API_TOKENS: the server REFUSES TO START with an empty token map, so
#   there is no window in which it is reachable and unauthenticated.
#
# Storage:
#   Everything under /mnt/fast/appdata/automation/neocortex-memory, on the mounted
#   fast/appdata/automation ZFS dataset (infra/lxc-selfhost.tf). NOT /mnt/fast/appdata/neocortex-memory:
#   /mnt/fast/appdata is not a mountpoint, so that would land on LXC 100's ext4 root - which was at
#   80% when this stack was written. node_modules and the embedding model are the two big items and
#   both live here by design. `node:22-bookworm-slim` declares no VOLUME (verified with
#   `docker image inspect --format '{{json .Config.Volumes}}'` -> null), so no anonymous volume.
#
# The code is the platform checkout, bind-mounted READ-ONLY from /mnt/fast/stacks-private. There is
# no image build: this is the stock Node image running a pinned commit of the repo. A rebuilt LXC
# gets the code back with a git clone and the data back from the dataset.

name: neocortex-memory


########################### NETWORKS
networks:
  # Traefik.
  t3_proxy:
    external: true
  # tsbridge lives here and resolves its backends BY CONTAINER NAME over Docker's
  # embedded DNS, so the api must share this network or every tailnet request is a
  # 502: "lookup neocortex-memory-api on 127.0.0.11:53: no such host" (TODO-317).
  traefik_default:
    external: true
  # agentic-os declares no named network, so compose gave its stack the default name. Joining it
  # is what lets `agentic-os-db` resolve by container name; the published 172.16.1.159:5433 is the
  # fallback, not the path used here.
  agentic-os_default:
    external: true


services:
  ########################### THE SERVER
  api:
    container_name: neocortex-memory-api
    hostname: neocortex-memory-api
    # renovate: datasource=docker depName=node
    # EXCLUDED FROM ALL AUTOMERGE in renovate.json5. A Node bump rebuilds nothing by itself, but it
    # does change the runtime under an ONNX native binary that was installed against the previous
    # ABI - `deps` must be re-run after any bump. Merging deploys nothing; see README
    # "Renovate deploy drift".
    image: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
    restart: unless-stopped
    # apps:apps on TrueNAS SCALE, the estate default. setup-neocortex-memory.sh prepare creates
    # every directory below owned 568:568.
    user: "${PUID:-568}:${PGID:-568}"
    working_dir: /app
    # PROVISIONAL - must be replaced by a measured value. The embedding model is loaded in-process
    # (MEMORY_API_SERVER_EMBEDDINGS=1), so steady state is dominated by the ONNX session, not by
    # request concurrency. TODO-315's acceptance records the p50 of 20 server-side-embedded
    # searches and the container's peak RSS; set this from that number and delete this note.
    mem_limit: 2g
    mem_reservation: 512m
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      TZ: ${TZ:-Europe/Dublin}

      # --- what this server IS -------------------------------------------------------------
      # No vault on this host. MEMORY_API_ROOT is resolved FIRST and makes the server vaultless:
      # it refuses to start if NEOCORTEX_VAULT or AGENTIC_OS_DIR is also set, so a stray value
      # cannot quietly point it at a directory that does not exist here.
      MEMORY_API_ROOT: /data/root
      MEMORY_MODEL_CACHE_DIR: /data/models
      NEOCORTEX_MEMORY_CONFIG: /app/memory/config/memory-config.json
      MEMORY_API_PORT: "8787"
      MEMORY_STORE_BACKEND: postgres
      # agentic-os-db runs without TLS, so node-postgres must not negotiate it. Without this the
      # very first connection dies with "The server does not support SSL connections" -- which is
      # how it was found on 2026-09-22. Every Mac already carries PGSSLMODE=disable in
      # ~/.config/neocortex/memory.env against this same server; the stack simply has to agree.
      # The link is container-to-container on a private bridge network, not over the LAN.
      PGSSLMODE: ${PGSSLMODE:-disable}
      # Embeddings are computed HERE, not by the client. That is what lets a client hold nothing
      # but a bearer token - no model, no DSN, no 400 MB download on a phone.
      MEMORY_API_SERVER_EMBEDDINGS: "1"

      # --- the server principal -------------------------------------------------------------
      # REQUIRED in hosted mode; the server refuses to start without it. This is the identity the
      # SERVER resolves token auth against - not the caller's identity, which comes from the
      # bearer token.
      #
      # The ID form on purpose, not TEAM_SLUG + USER_EMAIL. Both work, but the id pair cannot be
      # invalidated by editing a display field: the email on this user was changed within an hour
      # of it being created (2026-09-22), and a principal keyed on email would have started
      # failing at the next restart with no obvious connection to the edit.
      #
      # NOT the BOOTSTRAP_* pair either - those CREATE a team and owner before serving, and both
      # already exist here from `init-team` / `add-user`.
      #
      # Values come from those two commands and are recorded in .env by README step 7. They are
      # ids, not secrets.
      MEMORY_API_TEAM_ID: ${MEMORY_API_TEAM_ID:?set in .env - the id printed by `memory-admin init-team`}
      MEMORY_API_USER_ID: ${MEMORY_API_USER_ID:?set in .env - the users.id printed by `memory-admin add-user`}

      # --- the two stores ------------------------------------------------------------------
      MEMORY_DATABASE_URL: ${MEMORY_DATABASE_URL:?set in .env - the memory_api role on neocortex_memory}
      # Leave BOTH of these empty to turn the bridge off; setting only one is a start-up error
      # that names which half is missing.
      MEMORY_LEGACY_DATABASE_URL: ${MEMORY_LEGACY_DATABASE_URL:-}
      MEMORY_LEGACY_BRIDGE_USER_ID: ${MEMORY_LEGACY_BRIDGE_USER_ID:-}

      # --- authentication ------------------------------------------------------------------
      # <users.id>:<capability>:<sha256 of the token>, comma-separated. Only the HASH lives here;
      # the token itself is printed once by `memory-admin mint-token` and written to each client's
      # token file.
      #
      # DELIBERATELY `:-` AND NOT `:?`. It was `:?` briefly on 2026-09-22 and that broke the
      # bootstrap: compose interpolates the WHOLE file before it selects a service, so a required-
      # variable guard on `api` also blocks `docker compose run --rm deps` and every `admin`
      # command -- which are exactly the steps that must run BEFORE a token can exist. The guard
      # made the documented sequence impossible to execute.
      #
      # The real guard is server-side and unaffected: memory-api refuses to start on an empty
      # token map, which is what TODO-315's acceptance asserts. An empty value here means the
      # container starts and exits with that refusal, which is the intended behaviour.
      MEMORY_API_TOKENS: ${MEMORY_API_TOKENS:-}
    volumes:
      # The code: a PINNED COMMIT of the platform repo, read-only. Never `main`.
      - /mnt/fast/stacks-private/neocortex-platform:/app:ro
      # Production dependencies, built by the `deps` service below. Read-only here: the server has
      # no business writing to its own node_modules.
      #
      # /app/memory/node_modules, NOT /app/node_modules. The root package.json declares no
      # dependencies at all and says so: "Dependencies live in memory/package.json; install them
      # with `npm ci --prefix memory`." Node resolves `require("pg")` from memory/memory-api.cjs by
      # walking up from memory/, so this is the first directory it checks -- the same layout the
      # Macs use.
      - /mnt/fast/appdata/automation/neocortex-memory/deps/node_modules:/app/memory/node_modules:ro
      # The only two writable paths.
      - /mnt/fast/appdata/automation/neocortex-memory/root:/data/root
      - /mnt/fast/appdata/automation/neocortex-memory/models:/data/models
    command: ["node", "/app/memory/memory-api.cjs"]
    # No host port. Traefik on t3_proxy, and `docker exec` on LXC 100.
    networks:
      - t3_proxy
      - traefik_default
      - agentic-os_default
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The slim image ships no curl or wget. Node is right there, and /v1/health needs no auth.
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:8787/v1/health',r=>process.exit(r.statusCode===200?0:1))
          .on('error',()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      # The embedding model loads at start-up. Cold, that is tens of seconds; the cache on
      # /data/models makes every later start fast, but the first one after a model change is slow.
      start_period: 180s
    labels:
      - traefik.enable=true
      - traefik.docker.network=t3_proxy
      - traefik.http.routers.neocortex-memory-rtr.entrypoints=websecure
      - traefik.http.routers.neocortex-memory-rtr.rule=Host(`cortex.${DOMAINNAME}`)
      - traefik.http.routers.neocortex-memory-rtr.tls=true
      - traefik.http.routers.neocortex-memory-rtr.tls.certresolver=dns-cloudflare
      - traefik.http.routers.neocortex-memory-rtr.service=neocortex-memory-svc
      - traefik.http.services.neocortex-memory-svc.loadbalancer.server.port=8787

      # -- tailnet route (TODO-317) -----------------------------------------
      # The public Traefik router above stays for any non-Pi consumer. This adds
      # a SECOND, private entrypoint on the tailnet, because the mini cannot
      # complete a sustained index pass over its direct LAN path to this host:
      # it fails part-way with EHOSTUNREACH while ping and curl from the same
      # machine stay perfect. The same Traefik router and certificate carried
      # 149/149 when the TCP path was changed, so the route is the variable.
      #
      # tsbridge is this estate's existing idiom (chat, immich_server, mc_*),
      # and it uses tsnet, which is why it needs no /dev/net/tun on this LXC.
      #
      # whois is deliberately OFF: this API authenticates with a bearer token
      # and has no use for identity headers on a POST-heavy ingest path.
      - tsbridge.enabled=true
      - tsbridge.service.name=cortex
      - tsbridge.service.port=8787
      - tsbridge.service.tags=tag:prod
      - tsbridge.service.whois_enabled=false

  ########################### ONE-SHOT: PRODUCTION DEPENDENCIES
  # `docker compose run --rm deps`
  #
  # Why this is not just `npm ci` in the api container: /app is mounted READ-ONLY, and `npm ci`
  # begins by deleting node_modules - which, as a bind mount, cannot be deleted. So the install
  # happens in a plain directory (/deps), against a COPY of the manifests, and the api service
  # mounts the resulting node_modules back over /app/node_modules.
  #
  # The manifests come from memory/, not the repo root: the root package.json declares zero
  # dependencies and points at memory/package.json. Getting this wrong fails loudly (`cp: cannot
  # stat /src/package-lock.json`), which is how it was found on 2026-09-22.
  #
  # This needs outbound npm AND the ONNX runtime's native binary download -- @huggingface/transformers
  # makes this large: ~961 MB installed, which is exactly why it lives on the automation dataset and
  # not on LXC 100's root. If LXC 100 cannot reach them, build /deps in this same image on another
  # machine and stream the directory in.
  deps:
    profiles: ["setup"]
    image: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
    user: "${PUID:-568}:${PGID:-568}"
    working_dir: /deps
    environment:
      npm_config_cache: /deps/.npm-cache
    volumes:
      - /mnt/fast/stacks-private/neocortex-platform:/src:ro
      - /mnt/fast/appdata/automation/neocortex-memory/deps:/deps
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - >-
        cp /src/memory/package.json /src/memory/package-lock.json /deps/ &&
        npm ci --omit=dev &&
        echo "deps: $(ls /deps/node_modules | wc -l) packages"
    networks:
      - agentic-os_default
    security_opt:
      - no-new-privileges:true

  ########################### ONE-SHOT: CONTROL PLANE
  # `docker compose run --rm admin memory-admin <subcommand> ...`
  #
  # Identities, tokens and grants are written STRAIGHT TO THE DATABASE over a DSN, with no API in
  # the path - which is the only way the first token can exist at all, since the server refuses to
  # start with an empty token map.
  #
  # It must run HERE and nowhere else. On a Mac the same command resolves a local PGLite store
  # instead and creates identities in a database this API never reads - printing a perfectly
  # valid-looking token that authenticates nothing. `memory-admin` is a shim on PATH (bin/), so
  # the documented command reads the way the README writes it.
  admin:
    profiles: ["setup"]
    image: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
    user: "${PUID:-568}:${PGID:-568}"
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      TZ: ${TZ:-Europe/Dublin}
      MEMORY_API_ROOT: /data/root
      MEMORY_MODEL_CACHE_DIR: /data/models
      NEOCORTEX_MEMORY_CONFIG: /app/memory/config/memory-config.json
      MEMORY_STORE_BACKEND: postgres
      # agentic-os-db runs without TLS, so node-postgres must not negotiate it. Without this the
      # very first connection dies with "The server does not support SSL connections" -- which is
      # how it was found on 2026-09-22. Every Mac already carries PGSSLMODE=disable in
      # ~/.config/neocortex/memory.env against this same server; the stack simply has to agree.
      # The link is container-to-container on a private bridge network, not over the LAN.
      PGSSLMODE: ${PGSSLMODE:-disable}
      MEMORY_DATABASE_URL: ${MEMORY_DATABASE_URL:?set in .env}
      # Every command after the first admin exists needs an explicit actor. Exported in the shell
      # before `docker compose run`, per README step 5.
      MEMORY_ADMIN_ACTOR_USER_ID: ${MEMORY_ADMIN_ACTOR_USER_ID:-}
    volumes:
      - /mnt/fast/stacks-private/neocortex-platform:/app:ro
      - /mnt/fast/appdata/automation/neocortex-memory/deps/node_modules:/app/memory/node_modules:ro
      - /mnt/fast/appdata/automation/neocortex-memory/root:/data/root
      - /mnt/fast/appdata/automation/neocortex-memory/models:/data/models
      - ./bin/memory-admin:/usr/local/bin/memory-admin:ro
      - ./bin/memory-migrate:/usr/local/bin/memory-migrate:ro
    networks:
      - agentic-os_default
    security_opt:
      - no-new-privileges:true
