# Mosquitto - MQTT broker for TeslaMate
#
# Purpose:
#   TeslaMate publishes live vehicle state (battery, location, climate, lock
#   state) to MQTT. Home Assistant can subscribe to it for real-time entities
#   without hitting the Tesla API itself.
#
# Notes:
#   Runs with upstream's `mosquitto -c /mosquitto-no-auth.conf`, i.e. anonymous
#   access. That is only acceptable because this broker sits on the stack's
#   internal `teslamate` network with no published port and no t3_proxy
#   membership - nothing outside the stack can reach it.
#
#   To let Home Assistant subscribe, the correct move is to publish 1883 bound
#   to the LXC's LAN address AND switch to an authenticated mosquitto.conf in
#   the mosquitto-conf volume. Do not publish the port while it is no-auth.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: teslamate-mosquitto
    hostname: mosquitto
    mem_limit: 128m
    mem_reservation: 32m
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    # Upstream's `ports: - 1883:1883` stays commented out - see note above.
    volumes:
      - mosquitto-conf:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    networks:
      - teslamate
    security_opt:
      - no-new-privileges:true
