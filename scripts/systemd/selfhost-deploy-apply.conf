# selfhost-deploy-apply.conf — THE ONE EXPLICIT SWITCH from dry-run to apply for
# selfhost-deploy.service. A systemd drop-in, not an environment variable, so the live mode is
# visible in `systemctl cat selfhost-deploy.service`.
#
# NOT INSTALLED BY THE COMMIT THAT ADDED IT. Gated host step D3 in
# stacks/selfhosted/monitoring/README.md § Deploy agent — only after watching several dry runs.
#
# Enable apply:
#   install -D -m 0644 /mnt/fast/stacks/scripts/systemd/selfhost-deploy-apply.conf \
#     /etc/systemd/system/selfhost-deploy.service.d/apply.conf
#   systemctl daemon-reload
# Back to dry-run:
#   rm /etc/systemd/system/selfhost-deploy.service.d/apply.conf && systemctl daemon-reload

[Service]
# The empty ExecStart= is REQUIRED: a oneshot may carry several ExecStart lines and a drop-in
# APPENDS to them, so without this line the unit would run the dry-run AND the apply. The empty
# assignment clears the inherited ExecStart; the next line replaces it.
ExecStart=
ExecStart=/mnt/fast/stacks/scripts/deploy-stacks.sh --apply
